  const front = new THREE.Mesh(new THREE.ShapeGeometry(plan(w - .02, h - .02, r * .92), 24), bezelMat); front.position.z = d / 2 + .001; g.add(front);
  const c = document.createElement('canvas'); c.width = texW; c.height = texH;
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = maxAniso;
  const scr = new THREE.Mesh(new THREE.PlaneGeometry(sw, sh), new THREE.MeshBasicMaterial({ map: tex, toneMapped: false, transparent: true }));
  scr.position.z = d / 2 + .0032; g.add(scr);
  const glass = new THREE.Mesh(new THREE.ShapeGeometry(plan(w - .03, h - .03, r * .9), 24), glassMat); glass.position.z = d / 2 + .0045; g.add(glass);
  const btn = new THREE.Mesh(new RoundedBoxGeometry(.014, h * .09, d * .38, 2, .006), btnMat); btn.position.set(w / 2 + .004, h * .24, 0); g.add(btn);
  g.traverse(o => { if (o.isMesh) o.renderOrder = 10; });
  scene.add(g);
  return { group: g, screen: scr, ctx: c.getContext('2d'), tex };
}
const tablet = device(2.3, 1.66, .06, .16, 2.17, 1.532, TW, TH);
const pen = (() => {
  const g = new THREE.Group(), L = 1.25, R0 = .03;
  const bodyM = new THREE.MeshPhysicalMaterial({ color: '#2a2e32', metalness: .35, roughness: .28, clearcoat: .8, clearcoatRoughness: .15 });
  const metalM = new THREE.MeshStandardMaterial({ color: '#c3c8cc', metalness: 1, roughness: .25 });
  const bandM = new THREE.MeshStandardMaterial({ color: C.orange, metalness: .2, roughness: .35 });
  // drawn last and over everything: the pen is always in front of the screen
  [bodyM, metalM, bandM].forEach(m => { m.transparent = true; });
  const add = (geo, m, y) => { const o = new THREE.Mesh(geo, m); o.position.y = y; o.renderOrder = 50 + g.children.length; g.add(o); };
  add(new THREE.ConeGeometry(R0 * .8, .09, 32), metalM, .045); // the nib cone, turned to point down
  g.children[0].rotation.x = Math.PI;
  add(new THREE.CylinderGeometry(R0 * .82, R0 * .95, .06, 32), metalM, .12);
  add(new THREE.CylinderGeometry(R0, R0, L - .3, 32), bodyM, .15 + (L - .3) / 2);
  add(new THREE.CylinderGeometry(R0 * 1.004, R0 * 1.004, .05, 32), bandM, L - .3);
  add(new THREE.CylinderGeometry(R0, R0, .12, 32), bodyM, L - .09);
  add(new THREE.SphereGeometry(R0, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), bodyM, L - .03);
  // its parts still hide one another: the depth is cleared just before the first one is drawn
  g.children[0].onBeforeRender = (r) => r.clearDepth();
  tablet.group.add(g);
  return g;
})();
// held by a right hand: leaning back towards the viewer and to the right
const PEN_WRITE = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(.45, .32, .84).normalize());
const PEN_REST = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(.2, .92, .3).normalize());
const SURF = .036;
const toLocal = (u, v, lift = 0) => new THREE.Vector3((u / TW - .5) * 2.17, (.5 - v / TH) * 1.532, SURF + lift);
const penTarget = new THREE.Vector3(), penQ = new THREE.Quaternion();
let penLast = 0;
const tabQ = new THREE.Quaternion(), PEN_AXIS = new THREE.Vector3(), PEN_LIGHT = new THREE.Vector3();
function penFrame(T) {
  const cyc = T % 10, useUser = userStrokes.length > 0;
  const st0 = SCRIBBLE.client[0][0], start = toLocal(PAD.x + 70 + st0[0] * (PAD.w - 150), PAD.y + 40 + st0[1] * (PAD.h - 110), .09);
  const btn = [PAD.x + PAD.w - 116, 816], rest = new THREE.Vector3(1.4, -.45, .2);
  let k = .14, q = PEN_WRITE;
  if (useUser) { penTarget.copy(rest); q = PEN_REST; k = .06; }
  else if (cyc < .6) { penTarget.copy(start); k = .1; }
  else if (cyc < 4.6) { if (penTip) penTarget.copy(toLocal(penTip[0], penTip[1], 0)); k = .55; }
  else if (cyc < 5.0) { penTarget.copy(toLocal(btn[0], btn[1], .12)); k = .12; }
  else if (cyc < 5.2) { penTarget.copy(toLocal(btn[0], btn[1], .005)); k = .3; }
  else if (cyc < 5.6) { penTarget.copy(toLocal(btn[0], btn[1], .14)); k = .12; }
  else if (cyc < 9.4) { penTarget.copy(rest); q = PEN_REST; k = .05; }
  else { penTarget.copy(start); k = .06; }
  // frame-rate independent easing
  const dt = Math.min(.1, T - penLast) * 60; penLast = T;
  pen.position.lerp(penTarget, 1 - Math.pow(1 - k, dt));
  penQ.copy(q); pen.quaternion.slerp(penQ, 1 - Math.pow(.94, dt));
  // a soft light from the upper left, so the shadow falls beside the barrel
  penPose = { pos: pen.position, dir: PEN_AXIS.set(0, 1, 0).applyQuaternion(pen.quaternion), light: PEN_LIGHT.set(-.25, .6, 1) };
}
const phone = device(.78, 1.6, .075, .16, .716, 1.528, PW, PH);
// Slightly crossed, with air between them
// The Biometric PAD alone, large and centred: the product, to sign on (the phone is kept out of view)
const TPOS = new THREE.Vector3(0, 1.25, 0), PPOS = new THREE.Vector3(1.65, .98, .7);
tablet.group.position.copy(TPOS); tablet.group.rotation.set(-.16, .14, .01);
phone.group.position.copy(PPOS); phone.group.rotation.set(-.06, -.32, -.09); phone.group.visible = false;

/* The process, step by step, in a straight column beside the tablet */
const STEPS = [...document.querySelectorAll('.step')];
const stepSt = document.getElementById('step-st'), stepVal = document.getElementById('step-val'), stepBar = document.getElementById('step-bar');
function cardsFrame(T) {
  const cyc = T % 10, useUser = userStrokes.length > 0, out = useUser ? 0 : seg(cyc, 9.3, 9.8);
  const p = useUser ? 1 : eInOut(seg(cyc, .6, 4.6));
  const n = useUser ? userStrokes.flat().length : Math.round(p * 472);
  const show = [useUser ? 1 : seg(cyc, .1, .7), useUser ? 1 : seg(cyc, .8, 1.4), useUser ? 0 : seg(cyc, 5.5, 6.1)];
  STEPS.forEach((el, k) => { const a = eOut(show[k]) * (1 - out); el.style.opacity = a.toFixed(3); el.style.transform = `translateY(${((1 - eOut(show[k])) * 10).toFixed(1)}px)`; });
  stepVal.textContent = `${n} puntos · presión ${n ? Math.round(34 + p * 6) : 0} %`;
  stepSt.textContent = p >= 1 ? 'completado' : 'en curso';
  stepBar.style.transform = `scaleX(${p.toFixed(3)})`;
}
let wideView = true;

/* Light */
scene.add(new THREE.HemisphereLight('#ffffff', '#aeb8bc', .6));
const key = new THREE.DirectionalLight('#fff6ec', 1.3); key.position.set(3, 6, 5); scene.add(key);
const rim = new THREE.DirectionalLight('#ffd3a0', .7); rim.position.set(-4, 3, -4); scene.add(rim);

/* Soft contact shadows under the devices */
const SHW = 12, SHD = 10, SHH = 5;
const shadowGroup = new THREE.Group(); shadowGroup.position.set(-.3, .002, -.6); scene.add(shadowGroup);
const rt = new THREE.WebGLRenderTarget(1024, 1024); rt.texture.generateMipmaps = false;
const rtBlur = new THREE.WebGLRenderTarget(1024, 1024); rtBlur.texture.generateMipmaps = false;
const shPlaneGeo = new THREE.PlaneGeometry(SHW, SHD).rotateX(Math.PI / 2);
const shPlane = new THREE.Mesh(shPlaneGeo, new THREE.MeshBasicMaterial({ map: rt.texture, opacity: .55, transparent: true, depthWrite: false, toneMapped: false }));
shPlane.renderOrder = 1; shPlane.scale.y = -1; shadowGroup.add(shPlane);
const blurPlane = new THREE.Mesh(shPlaneGeo); blurPlane.visible = false; shadowGroup.add(blurPlane);
const shCam = new THREE.OrthographicCamera(-SHW / 2, SHW / 2, SHD / 2, -SHD / 2, 0, SHH); shCam.rotation.x = Math.PI / 2; shadowGroup.add(shCam);
const depthMat = new THREE.MeshDepthMaterial(); depthMat.userData.darkness = { value: 1.3 };
depthMat.onBeforeCompile = sh => {
  sh.uniforms.darkness = depthMat.userData.darkness;
  sh.fragmentShader = 'uniform float darkness;\n' + sh.fragmentShader.replace('gl_FragColor = vec4( vec3( 1.0 - fragCoordZ ), opacity );', 'gl_FragColor = vec4( vec3( 0.0 ), ( 1.0 - fragCoordZ ) * darkness );');
};
depthMat.depthTest = false; depthMat.depthWrite = false;
const hBlur = new THREE.ShaderMaterial(HorizontalBlurShader); hBlur.depthTest = false;
const vBlur = new THREE.ShaderMaterial(VerticalBlurShader); vBlur.depthTest = false;
function blurShadow(amount) {
  blurPlane.visible = true;
  blurPlane.material = hBlur; hBlur.uniforms.tDiffuse.value = rt.texture; hBlur.uniforms.h.value = amount / 256;
  renderer.setRenderTarget(rtBlur); renderer.render(blurPlane, shCam);
  blurPlane.material = vBlur; vBlur.uniforms.tDiffuse.value = rtBlur.texture; vBlur.uniforms.v.value = amount / 256;
  renderer.setRenderTarget(rt); renderer.render(blurPlane, shCam);
  blurPlane.visible = false;
}
function renderContactShadow() {
  [backdrop, floor, shPlane, tech, halo, mesh].forEach(o => o.visible = false);
  [tablet, phone].forEach(d => d.group.children.forEach(m => { if (m.material === glassMat) m.visible = false; }));
  scene.overrideMaterial = depthMat;
  renderer.setClearColor(0x000000, 0);
  renderer.setRenderTarget(rt); renderer.clear(); renderer.render(scene, shCam);
  scene.overrideMaterial = null;
  blurShadow(3.2); blurShadow(1.4);
  renderer.setRenderTarget(null); renderer.setClearColor(0x000000, 1);
  [backdrop, floor, shPlane, tech, halo, mesh].forEach(o => o.visible = true);
  [tablet, phone].forEach(d => d.group.children.forEach(m => { if (m.material === glassMat) m.visible = true; }));
}

/* Post: a faint vignette and grain, multisampled for crisp edges */
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { samples: 4, type: THREE.HalfFloatType }));
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new OutputPass());
const finish = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, time: { value: 0 }, res: { value: new THREE.Vector2(1, 1) } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float time; uniform vec2 res; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
    void main(){
      vec4 c = texture2D(tDiffuse, vUv);
      vec2 q = vUv - .5; q.x *= res.x / res.y;
      c.rgb *= mix(.9, 1., smoothstep(1.05, .25, length(q)));
      c.rgb += (h(vUv * res + fract(time) * 100.) - .5) * .015;
      gl_FragColor = c;
    }`,
});
composer.addPass(finish);

/* ================= interaction: sign on the tablet ================= */
let idleUntil = 0;
controls.addEventListener('start', () => { idleUntil = Infinity; document.getElementById('hint').style.opacity = 0; });
controls.addEventListener('end', () => { idleUntil = clockNow() + 4; });
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let drawing = false, lastPt = null;
function hitTablet(e) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObject(tablet.screen)[0];
  if (!hit) return null;
  const x = hit.uv.x * TW, y = (1 - hit.uv.y) * TH;
  return (x > PAD.x + 8 && x < PAD.x + PAD.w - 8 && y > PAD.y + 8 && y < PAD.y + PAD.h - 8) ? { x, y } : null;
}
renderer.domElement.addEventListener('pointerdown', e => {
  const p = hitTablet(e); if (!p) return;
  if (clockNow() - lastInk > 6) userStrokes = [];
  controls.enabled = false; drawing = true;
  renderer.domElement.setPointerCapture(e.pointerId);
  lastPt = { ...p, time: performance.now() };
  userStrokes.push([{ ...p, p: .5 }]);
  lastInk = clockNow();
});
renderer.domElement.addEventListener('pointermove', e => {
  if (!drawing) { renderer.domElement.style.cursor = hitTablet(e) ? 'crosshair' : 'grab'; return; }
  const p = hitTablet(e); if (!p) return;
  const now = performance.now(), d = Math.hypot(p.x - lastPt.x, p.y - lastPt.y), sp = d / Math.max(1, now - lastPt.time);
  userStrokes.at(-1).push({ ...p, p: Math.max(.12, Math.min(1, 1.1 - sp * .4)) });
  lastPt = { ...p, time: now }; lastInk = clockNow();
});
const endDraw = () => { if (drawing) { drawing = false; controls.enabled = true; } };
renderer.domElement.addEventListener('pointerup', endDraw);
renderer.domElement.addEventListener('pointercancel', endDraw);

function fit() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h); composer.setSize(w, h);
  finish.uniforms.res.value.set(w, h);
  camera.aspect = w / h;
  camera.fov = w / h < .9 ? 48 : 30;
  wideView = w / h > 1.25;
  // wide screens: closer, and the tablet drawn up beside the step column
  const wasWide = HOME.z < 5;
  if (wideView !== wasWide) {
    const dx = wideView ? -.12 : 0, dz = wideView ? 4.25 : 5.1;
    camera.position.x += (dx + .2) - HOME.x; camera.position.z += dz - HOME.z;
    HOME.set(dx + .2, 1.6, dz); controls.target.set(dx + .05, 1.2, 0);
  }
  camera.updateProjectionMatrix();
  const visH = 2 * CODE_DIST * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)), visW = visH * camera.aspect;
  const bandH = visH, bandW = bandH * (CODE_W / CODE_H);
  tech.scale.set(bandW, bandH, 1);
  tech.position.set(visW / 2 - bandW / 2 - visW * .02, 0, -CODE_DIST);
}
addEventListener('resize', fit); fit();

/* ================= loop ================= */
const clock = new THREE.Clock();
const clockNow = () => clock.getElapsedTime();
let prev = 0, introT = 0, frameN = 0, codeLast = 0;
const sph = new THREE.Spherical(), tmp = new THREE.Vector3();

function frame() {
  const T = clockNow(); prev = T;
  if (userStrokes.length && T - lastInk > 6 && !drawing) userStrokes = [];

  frameN++;
  if (frameN % 2 === 0) {
    if (frameN % 4 === 0) { drawCode(T, Math.min(.2, T - codeLast)); codeLast = T; codeTex.needsUpdate = true; }
    tabletUI(tablet.ctx, T); roundScreen(tablet.ctx, TW, TH, 54); tablet.tex.needsUpdate = true;
    cardsFrame(T);
    if (userStrokes.length === 0 && T % 10 < .6) penTip = null;
    phoneUI(phone.ctx, T); island(phone.ctx); roundScreen(phone.ctx, PW, PH, 78); phone.tex.needsUpdate = true;
  }

  const it = eInOut((T - introT) / 3.2);
  if (it < 1) camera.position.lerpVectors(START, HOME, it);
  else if (T > idleUntil && !reduced) {
    tmp.copy(camera.position).sub(controls.target); sph.setFromVector3(tmp);
    sph.theta += (.02 + Math.sin(T * .12) * .16 - sph.theta) * .01;
    sph.phi += (1.44 + Math.sin(T * .09) * .04 - sph.phi) * .01;
    tmp.setFromSpherical(sph); camera.position.copy(controls.target).add(tmp);
  }
  if (it >= 1 && idleUntil === 0) idleUntil = T;

  if (!reduced) {
    mesh.rotation.y = Math.sin(T * .05) * .06; mesh.position.y = Math.sin(T * .12) * .08;
    tablet.group.position.y = TPOS.y + Math.sin(T * .45) * .035;
    phone.group.position.y = PPOS.y + Math.sin(T * .45 + 1.7) * .04;
  }

  penFrame(T);
  controls.update();
  if (frameN % 2 === 0) renderContactShadow();
  finish.uniforms.time.value = T;
  composer.render();
}

/* Run only while the page holding it says it is on screen */
addEventListener('message', (e) => {
  if (e.data && typeof e.data.fhVisible === 'boolean') renderer.setAnimationLoop(e.data.fhVisible ? frame : null);
});
introT = clockNow();
frameN = 1;
frame();
stage.classList.add('on');
renderer.setAnimationLoop(frame);
</script>
