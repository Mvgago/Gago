<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Tolva — banderola</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #d9cbb6; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js" } }</script>
<script type="module">
  // Tolva's round blade sign, out from a warm plaster wall in late sun, leaf shadows across it. It sways a
  // touch, and turns a little toward the pointer.
  import * as THREE from "three";

  const RUST = "#b05c3d", CREAM = "#efe6d6", INK = "#232220";
  await document.fonts.load("800 40px Syne");
  await document.fonts.load("700 20px Syne");

  // ---- the faces, drawn ----
  function face(back) {
    const S = 1024, c = document.createElement("canvas"); c.width = c.height = S;
    const x = c.getContext("2d");
    x.fillStyle = CREAM; x.fillRect(0, 0, S, S);
    const m = S / 2;
    x.strokeStyle = RUST; x.lineWidth = 10;
    x.beginPath(); x.arc(m, m, 455, 0, Math.PI * 2); x.stroke();
    if (!back) {
      // simply the logo: the small seal above, the name under it
      const sy = m - 120, sr = 128;
      x.strokeStyle = INK; x.lineWidth = 5;
      x.beginPath(); x.arc(m, sy, sr, 0, Math.PI * 2); x.stroke();
      x.lineWidth = 3; x.beginPath(); x.arc(m, sy, sr * .66, 0, Math.PI * 2); x.stroke();
      const words = "TOLVA · TOSTADERO DE CAFÉ · ";
      x.fillStyle = INK; x.font = "700 25px Syne"; x.textAlign = "center"; x.textBaseline = "middle";
      const r = sr * .83, step = (Math.PI * 2) / words.length;
      [...words].forEach((ch, i) => {
        const a = -Math.PI / 2 + (i - 2) * step; // "TOLVA" centred at the top
        x.save(); x.translate(m + Math.cos(a) * r, sy + Math.sin(a) * r); x.rotate(a + Math.PI / 2); x.fillText(ch, 0, 0); x.restore();
      });
      const bean = (bx, by, rot, col) => {
        x.save(); x.translate(bx, by); x.rotate(rot);
        x.fillStyle = col; x.beginPath(); x.ellipse(0, 0, 15, 22, 0, 0, Math.PI * 2); x.fill();
        x.strokeStyle = CREAM; x.lineWidth = 3.5; x.lineCap = "round";
        x.beginPath(); x.moveTo(0, -17); x.bezierCurveTo(-7, -6, 7, 6, 0, 17); x.stroke();
        x.restore();
      };
      bean(m - 15, sy, -0.25, RUST); bean(m + 15, sy + 3, 0.18, "#75574b");
      x.fillStyle = INK; x.font = "800 150px Syne"; x.fillText("TOLVA", m, m + 150);
    } else {
      // the other side: the roast curve, and what is inside
      x.fillStyle = INK; x.font = "800 92px Syne"; x.textAlign = "center"; x.textBaseline = "middle";
      x.fillText("CAFÉ", m, m - 150);
      x.strokeStyle = RUST; x.lineWidth = 14; x.lineCap = "round";
      x.beginPath(); x.moveTo(m - 300, m - 30); x.bezierCurveTo(m - 240, m - 30, m - 210, m + 110, m - 120, m + 110);
      x.bezierCurveTo(m, m + 110, m + 140, m + 10, m + 300, m - 30); x.stroke();
      x.fillStyle = RUST; x.beginPath(); x.arc(m + 300, m - 30, 20, 0, Math.PI * 2); x.fill();
      x.fillStyle = INK; x.font = "700 40px Syne";
      x.fillText("TOSTADERO · BARRA · TIENDA", m, m + 230);
    }
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
    return t;
  }

  // ---- the wall: warm plaster, a little uneven ----
  function plaster() {
    const S = 1024, c = document.createElement("canvas"); c.width = c.height = S;
    const x = c.getContext("2d"), img = x.createImageData(S, S);
    for (let i = 0; i < img.data.length; i += 4) {
      const n = 222 + (Math.random() - .5) * 14;
      img.data[i] = n; img.data[i + 1] = n - 12; img.data[i + 2] = n - 30; img.data[i + 3] = 255;
    }
    x.putImageData(img, 0, 0);
    x.filter = "blur(1.2px)"; x.drawImage(c, 0, 0);
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, 3);
    return t;
  }
  // leaves between the sun and the wall: soft dark blots, laid over the plaster
  function leaves() {
    const S = 1024, c = document.createElement("canvas"); c.width = c.height = S;
    const x = c.getContext("2d");
    x.fillStyle = "#fff"; x.fillRect(0, 0, S, S);
    for (let i = 0; i < 700; i++) {
      const px = Math.random() * S, py = Math.random() * S * .9 + S * .05;
      // more of them up and to the right, the way a branch would hang
      if (Math.random() > (px / S) * .9 + .25) continue;
      x.fillStyle = `rgba(120,94,68,${.16 + Math.random() * .2})`;
      x.beginPath(); x.ellipse(px, py, 10 + Math.random() * 18, 4 + Math.random() * 8, Math.random() * Math.PI, 0, Math.PI * 2); x.fill();
    }
    // softened all at once (a blur on every blot was far too slow)
    const soft = document.createElement("canvas"); soft.width = soft.height = S;
    const sx = soft.getContext("2d"); sx.filter = "blur(5px)"; sx.drawImage(c, 0, 0);
    const t = new THREE.CanvasTexture(soft); t.colorSpace = THREE.SRGBColorSpace;
    return t;
  }

  // ---- scene ----
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, 1, .1, 50);

  // the wall faces the camera's side (+z), the sign stands out from it along z
  const wallMat = new THREE.MeshStandardMaterial({ map: plaster(), roughness: .95 });
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(30, 20), wallMat);
  wall.receiveShadow = true; scene.add(wall);
  const shade = new THREE.Mesh(new THREE.PlaneGeometry(30, 20), new THREE.MeshBasicMaterial({ map: leaves(), blending: THREE.MultiplyBlending, transparent: true }));
  shade.position.z = .002; scene.add(shade);

  // the sign: a drum, faces left and right, a rust band round it, a rust rim at each face
  const R = 1, T = .14;
  const rust = new THREE.MeshStandardMaterial({ color: RUST, roughness: .45, metalness: .55 });
  const sign = new THREE.Group();
  // the band round the edge, open; the two faces as discs of their own, so their drawings stand upright
  const drum = new THREE.Mesh(new THREE.CylinderGeometry(R, R, T, 96, 1, true), rust);
  drum.rotation.z = -Math.PI / 2;
  drum.castShadow = true; sign.add(drum);
  for (const [sx, back] of [[1, false], [-1, true]]) {
    const disc = new THREE.Mesh(new THREE.CircleGeometry(R, 96), new THREE.MeshStandardMaterial({ map: face(back), roughness: .6 }));
    disc.rotation.y = sx * Math.PI / 2; disc.position.x = sx * T / 2; disc.castShadow = true; sign.add(disc);
  }
  for (const sx of [-1, 1]) {
    const rim = new THREE.Mesh(new THREE.TorusGeometry(R, .028, 16, 96), rust);
    rim.rotation.y = Math.PI / 2; rim.position.x = sx * T / 2; rim.castShadow = true; sign.add(rim);
  }
  // the bracket: a plate on the wall, an arm out over the sign, two short rods down to it
  const iron = new THREE.MeshStandardMaterial({ color: "#2a2522", roughness: .5, metalness: .6 });
  const plate = new THREE.Mesh(new THREE.BoxGeometry(.32, .5, .04), iron); plate.position.set(0, R + .32, .02);
  const arm = new THREE.Mesh(new THREE.BoxGeometry(.05, .05, 2.6), iron); arm.position.set(0, R + .32, 1.3);
  [plate, arm].forEach((m) => { m.castShadow = true; scene.add(m); });
  const hang = new THREE.Group(); hang.position.set(0, R + .32, 1.4); scene.add(hang);
  for (const dz of [-.55, .55]) {
    const rod = new THREE.Mesh(new THREE.CylinderGeometry(.014, .014, .3, 12), iron);
    rod.position.set(0, -.15, dz); rod.castShadow = true; hang.add(rod);
  }
  sign.position.set(0, -.3 - R, 0); hang.add(sign);

  // late sun from the upper left and in front, warm; a soft fill from the room
  scene.add(new THREE.HemisphereLight(0xfff3e2, 0x8a6e52, 1.5));
  const sun = new THREE.DirectionalLight(0xffd9a8, 2.6);
  sun.position.set(6, 5, 5); sun.target.position.set(0, 0, 1);
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: .5, far: 20 });
  sun.shadow.radius = 10; sun.shadow.bias = -.0006;
  scene.add(sun, sun.target);

  // ---- framing ----
  const look = new THREE.Vector3(-.1, -.15, 1.3);
  let ax = 0, tx = 0;
  function size() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    // narrow frames: drawn back, so the whole sign stays in
    camera.position.set(4.3, .2, 6.4).multiplyScalar(w / h < 1 ? 1.35 : 1);
    camera.updateProjectionMatrix();
  }
  size(); addEventListener("resize", size);
  addEventListener("pointermove", (e) => { tx = (e.clientX / innerWidth - .5) * .5; });

  let visible = true, t = 0, last = performance.now();
  addEventListener("message", (e) => {
    if (e.origin !== location.origin || typeof e.data?.fhVisible !== "boolean") return;
    visible = e.data.fhVisible;
  });
  renderer.setAnimationLoop((now) => {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (!visible) return;
    t += dt;
    // a breath of wind: it turns a little on its rods, and swings a hair
    hang.rotation.y = Math.sin(t * .7) * .05 + ax;
    hang.rotation.z = Math.sin(t * 1.1) * .012;
    ax += (tx - ax) * Math.min(1, dt * 3);
    camera.lookAt(look);
    renderer.render(scene, camera);
  });
</script>
</body>
</html>
