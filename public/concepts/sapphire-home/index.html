<style>
/* The Sapphire's own light: warm stone, pale oak, white linen, the sea beyond, sapphire blue for accents */
:root {
  --ground: #f0f0ef;
  --ink: #1d2230;
  --soft: rgba(29, 34, 48, 0.6);
  --sapphire: #1f3fa6;
  --glass: rgba(255, 255, 255, 0.62);
  --display: 'Jura', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; }
body { background: var(--ground); color: var(--ink); overflow: hidden; -webkit-tap-highlight-color: transparent; }
#stage { position: fixed; inset: 0; opacity: 0; transition: opacity 1.2s ease; }
#stage.on { opacity: 1; }
#stage canvas { display: block; width: 100%; height: 100%; }

/* The HUD: the project's name, fixed in its corner, never moving with the scene */
.hud { position: fixed; inset: 0; pointer-events: none; }

.cap, .hint { position: fixed; top: 26px; font-family: var(--mono); font-size: 10px; font-weight: 300; letter-spacing: 0.08em; text-transform: uppercase; color: var(--soft); pointer-events: none; margin: 0; transition: color 1.2s, opacity .6s; }
.cap { left: 34px; display: flex; flex-direction: column; gap: 5px; }
.cap b { font-family: var(--display); font-weight: 300; font-size: 22px; letter-spacing: .02em; text-transform: none; color: var(--ink); transition: color 1.2s; }
.hint { right: 34px; display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 2px; background: rgba(29, 34, 48, 0.32); color: #f4f1ec; text-transform: none; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.hint svg { width: 15px; height: 15px; animation: sway 1.8s ease-in-out infinite; }
@keyframes sway { 0%, 100% { transform: translateX(-3px) rotate(-8deg); } 50% { transform: translateX(3px) rotate(8deg); } }
body.night .cap, body.night .cap b { color: rgba(244, 241, 236, 0.85); }
/* the credit the stool's licence asks for: present, but as quiet as the page allows */
/* the 3D models' credits, as their licences ask: a quiet link in the corner that opens the list */
.credit { position: fixed; left: 34px; bottom: 7px; margin: 0; padding: 0; border: 0; background: none; cursor: pointer; font-family: var(--mono); font-size: 8px; letter-spacing: .04em; color: rgba(29, 34, 48, .28); transition: color .4s, opacity .6s; }
.credit:hover { color: rgba(29, 34, 48, .6); }
body.night .credit { color: rgba(244, 241, 236, .3); }
.credits { position: fixed; left: 34px; bottom: 26px; z-index: 3; width: min(360px, calc(100vw - 40px)); box-sizing: border-box; padding: 14px 16px 12px; background: rgba(250, 250, 248, .94); border: 1px solid rgba(29, 34, 48, .12); border-radius: 3px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 14px 40px rgba(30, 36, 50, .16); font-family: var(--mono); font-size: 10px; line-height: 1.5; color: var(--ink); }
.credits[hidden] { display: none; }
.credits b { display: block; margin-bottom: 8px; font-weight: 400; font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); }
.credits ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.credits a { color: inherit; text-decoration: none; border-bottom: 1px solid rgba(29, 34, 48, .2); }
.credits a:hover { color: var(--sapphire); border-color: currentColor; }
.credits small { color: var(--soft); font-size: 9px; }

/* loading: the name and a 1px line filling, then the scene comes up under it as it fades */
.loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: var(--ground); z-index: 5; transition: opacity .9s ease; }
/* the development's own wordmark, as on its sales plan: THE / SAPPHIRE / RESIDENCES in a light geometric
   sans (Jost, the open Futura), capitals tracked wide */
.loader .ln { display: flex; flex-direction: column; align-items: center; gap: 7px; font-family: 'Jost', var(--display); font-weight: 300; color: var(--ink); text-transform: uppercase; }
.loader .ln .wm { font-weight: 300; font-size: 25px; letter-spacing: .6em; margin-right: -.6em; }
.loader .ln small { font-size: 8px; letter-spacing: .7em; margin-right: -.7em; color: var(--soft); }
.loader i { position: relative; width: 160px; height: 1px; background: rgba(29,34,48,.12); overflow: hidden; }
.loader b { position: absolute; inset: 0; width: 100%; transform-origin: left; transform: scaleX(0); background: var(--ink); transition: transform .4s ease; }
.loader.gone { opacity: 0; pointer-events: none; }
/* The rooms: a quiet tag on each, as on the plan, that takes the camera there */
.tag { position: fixed; left: 0; top: 0; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 1px; font-family: var(--display); font-weight: 400; font-size: 11px; letter-spacing: .03em; color: var(--ink); background: rgba(250, 250, 248, .55); border: 1px solid rgba(29, 34, 48, .07); border-radius: 2px; padding: 3px 8px 4px; margin-top: -11px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: 0 3px 10px rgba(30, 36, 50, .05); cursor: pointer; white-space: nowrap; transition: opacity .5s, color .3s, border-color .3s; user-select: none; }
.tag::after { content: ''; position: absolute; left: 50%; top: 100%; width: 1px; height: 9px; background: rgba(29, 34, 48, .3); }
.tag::before { content: ''; position: absolute; left: calc(50% - 1.5px); top: calc(100% + 8px); width: 4px; height: 4px; border-radius: 50%; background: rgba(29, 34, 48, .7); }
/* at night the tags step back: the name only, smaller, on a faint dark glass */
body.night .tag { color: rgba(244,241,236,.9); background: rgba(28, 32, 42, .42); border-color: rgba(244,241,236,.1); box-shadow: none; font-size: 10.5px; padding: 3px 7px; }
body.night .tag small { display: none; } body.night .tag::after, body.night .tag::before { background: rgba(244,241,236,.7); }
.tag small { font-family: var(--mono); font-weight: 300; font-size: 8.5px; letter-spacing: .06em; color: var(--soft); }
.tag:hover, .tag.on { background: rgba(250, 250, 248, .9); }
.tag:hover { color: var(--sapphire); }
.tag.on { color: var(--sapphire); border-color: var(--sapphire); } .tag.on::before, .tag.on::after { background: var(--sapphire); }
.tag.hide { opacity: 0; pointer-events: none; }

/* the guided walk: a button at the head of the controls, and a caption naming each room as it is reached */
.tourbtn { font: inherit; font-family: var(--mono); font-weight: 400; letter-spacing: .06em; text-transform: uppercase; font-size: 10px; color: #f4f1ec; background: rgba(59, 55, 52, .9); border: 0; border-radius: 2px; padding: 7px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: background .25s; }
/* the site's own Index pill: warm graphite, a shade lighter on hover */
.tourbtn:hover { background: #4d4744; }
.tourbtn svg { width: 9px; height: 9px; fill: currentColor; }
.tourcap { position: fixed; left: 34px; bottom: 86px; display: flex; flex-direction: column; gap: 3px; pointer-events: none; padding: 16px 22px 16px 18px; margin-left: -18px; background: rgba(245,245,243,.78); border-left: 1px solid var(--ink); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); opacity: 0; transform: translateY(6px); transition: opacity .7s ease, transform .7s ease; }
.tourcap.on { opacity: 1; transform: none; }
.tourcap > * { transition: opacity .8s ease, transform .8s ease; } .tourcap:not(.on) > * { opacity: 0; transform: translateY(8px); }
.tourcap.on > :nth-child(2) { transition-delay: .08s; } .tourcap.on > :nth-child(3) { transition-delay: .16s; } .tourcap.on > :nth-child(4) { transition-delay: .26s; }
/* while walking: thin letterbox bars come in, the room tags and the hint step back */
/* a true letterbox: solid bands in the site's warm graphite, tall enough to frame the shot, the caption
   resting on the lower one and the controls set within it */
.bars i { position: fixed; left: 0; right: 0; height: 0; background: rgba(59, 55, 52, .62); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 1; pointer-events: none; transition: height .9s cubic-bezier(.6,0,.2,1); }
.bars i:first-child { top: 0; } .bars i:last-child { bottom: 0; }
body.touring .bars i { height: 11vh; }
body.touring .tourcap { bottom: calc(11vh + 18px); }
body.touring .panel { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.1); box-shadow: none; }
body.touring .panel .group > span, body.touring .panel .group button { color: rgba(244,241,236,.6); }
body.touring .panel .group button.on { color: #f4f1ec; background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.2); }
body.touring .panel .sep { background: rgba(255,255,255,.12); }
body.touring .tag { opacity: 0; pointer-events: none; } body.touring .hint, body.touring .credit { opacity: 0; }
body.touring .hud .cap { opacity: 0; }
/* ?bare (the studio page): the scene alone, no title, hint, tags or controls over it; only the credits stay */
body.bare .hud, body.bare .hint, body.bare #tags, body.bare .panel, body.bare .tourcap, body.bare .bars { display: none; }
/* nor the development's logo while it loads: on the studio page it is the studio's example, not The Sapphire's
   page; a plain ground until the scene is ready */
html.bare .loader .ln, html.bare .loader i { display: none; }
/* and no credits over it there: they stay on the full viewer, one click away */
html.bare .credit, html.bare .credits { display: none; }
.panel, .tourcap { z-index: 2; }
.tourcap small { font-family: var(--mono); font-weight: 300; font-size: 9px; letter-spacing: .12em; color: var(--soft); }
.tourcap b { font-family: var(--display); font-weight: 300; font-size: 30px; letter-spacing: .01em; color: var(--ink); line-height: 1.05; }
.tourcap span { font-family: var(--mono); font-weight: 300; font-size: 11px; letter-spacing: .06em; color: var(--soft); }
.tourcap p { margin: 6px 0 0; max-width: 320px; font-family: var(--display); font-weight: 300; font-size: 14px; line-height: 1.35; color: var(--ink); opacity: .82; }
body.night .tourcap p { color: #f4f1ec; }
.tourcap i { display: block; margin-top: 12px; width: 120px; height: 1px; background: rgba(29,34,48,.15); overflow: hidden; }
.tourcap em { display: block; height: 100%; width: 100%; background: var(--ink); transform-origin: left; transform: scaleX(0); }
body.night .tourcap { background: rgba(28,32,42,.72); border-left-color: #f4f1ec; } body.night .tourcap b { color: #f4f1ec; } body.night .tourcap small, body.night .tourcap span { color: rgba(244,241,236,.7); } body.night .tourcap em { background: #f4f1ec; }
/* The controls: one pane of frosted glass at the foot */
/* only the walk's button is solid; the settings sit light on frosted glass, the chosen one in a soft
   white chip with a hairline, so the colour swatch always shows */
.panel { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 12px; align-items: center; padding: 5px 6px; border-radius: 3px; background: rgba(255, 255, 255, .42); border: 1px solid rgba(29,34,48,.07); backdrop-filter: blur(12px) saturate(1.2); -webkit-backdrop-filter: blur(12px) saturate(1.2); box-shadow: 0 8px 24px rgba(30, 36, 50, .07); font-family: var(--mono); font-weight: 300; font-size: 10.5px; max-width: calc(100vw - 68px); box-sizing: border-box; }
.group { display: flex; align-items: center; gap: 2px; }
.group > span { color: rgba(29, 34, 48, .5); margin: 0 4px 0 2px; letter-spacing: .1em; text-transform: uppercase; font-size: 9px; }
.group button { font: inherit; letter-spacing: .03em; color: rgba(29, 34, 48, .55); background: transparent; border: 1px solid transparent; padding: 5px 9px; border-radius: 2px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background .25s, color .25s, border-color .25s; }
.group button:hover { color: var(--ink); background: rgba(255, 255, 255, .5); }
.group button.on { color: var(--ink); background: rgba(255, 255, 255, .85); border-color: rgba(29, 34, 48, .14); }
.sw { width: 9px; height: 9px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); flex: none; }
.sep { width: 1px; align-self: stretch; margin: 4px 0; background: rgba(29, 34, 48, .08); }

/* phones: one row, each setting a pill that steps through its options at a tap */
.cycle { display: none; }
@media (max-width: 760px) {
  .cap { left: 22px; top: 20px; font-size: 9px; max-width: 62%; }
  .cap b { font-size: 17px; }
  /* the hint on a phone: centred just above the controls, clear of the title and over the tags */
  .hint { right: auto; left: 50%; top: auto; bottom: 74px; transform: translateX(-50%); z-index: 3; white-space: nowrap; font-size: 10.5px; padding: 5px 10px; }
  .panel { left: 20px; right: 20px; transform: none; bottom: 22px; max-width: none; gap: 6px; padding: 6px; font-size: 10.5px; justify-content: space-between; }
  .credit { left: 20px; bottom: 7px; font-size: 7.5px; } .credits { left: 20px; }
  .group, .sep { display: none; }
  .tourbtn { padding: 0 11px; align-self: stretch; } .tourbtn span { display: none; }
  /* the walk's caption on a phone: a small card just above the controls, name and line only */
  .tourcap { left: 20px; right: auto; bottom: 74px; margin-left: 0; padding: 7px 11px 8px 10px; gap: 1px; max-width: 62vw; }
  /* on a phone the lower band holds the controls whole (never shorter than them), and the caption sits
     clear above both */
  body.touring .bars i { height: max(9vh, 84px); } body.touring .bars i:first-child { height: 7vh; }
  body.touring .tourcap { bottom: calc(max(9vh, 84px) + 10px); }
  body.touring .cycle { background: rgba(255,255,255,.1); color: #f4f1ec; } body.touring .cycle small { color: rgba(244,241,236,.6); }
  .tourcap small, .tourcap i { display: none; }
  .tourcap b { font-size: 15px; } .tourcap span { font-size: 9px; }
  .tourcap p { margin-top: 2px; font-size: 11.5px; line-height: 1.3; max-width: none; }
  .cycle { display: flex; flex: 1; flex-direction: column; align-items: flex-start; gap: 1px; font: inherit; color: var(--ink); background: rgba(255,255,255,.55); border: 0; border-radius: 2px; padding: 6px 9px 7px; cursor: pointer; min-width: 0; }
  .cycle small { font-size: 9.5px; color: var(--soft); letter-spacing: .04em; }
  .cycle b { font-weight: 400; display: flex; align-items: center; gap: 6px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  /* the three pills share the row equally whatever their words, and a long one is cut short, never pushed off */
  .cycle { overflow: hidden; flex: 1 1 0 !important; } .panel { overflow: hidden; } .tourbtn { flex: none; }
  .cycle small, .cycle b { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* on phones the tags step back as they do at night: the name only, smaller, on a faint glass */
  .tag { font-size: 10px; padding: 3px 7px; background: rgba(250, 250, 248, .5); border-color: rgba(29, 34, 48, .08); box-shadow: none; color: rgba(29, 34, 48, .75); }
  .tag small { display: none; }
}
</style>

const AUTO = new URLSearchParams(location.search).has('tour');
const LINES = {
  es: { sea: 'El salón se abre por completo a la terraza y al mar.', kitchenR: 'Isla de mármol, abierta al salón y a la terraza.', dining: 'Mesa para seis junto al ventanal, con la terraza al lado.', living: 'Ventanales de suelo a techo con vistas al mar.', terrace: '84 m² exteriores: comedor, zona de estar y solárium.', bed3: 'Dos camas individuales y ventanal a la terraza.', bed2: 'Dos camas individuales y armario empotrado.', bedroom: 'Dormitorio principal con vestidor y baño propio.', hall: 'Un recibidor amplio que reparte toda la vivienda.', home: 'Tres dormitorios y terrazas en dos fachadas, en primera línea de mar.' },
  en: { sea: 'The living room opens fully onto the terrace and the sea.', kitchenR: 'A marble island, open to the living room and terrace.', dining: 'Seats six by the window, with the terrace right beside it.', living: 'Floor-to-ceiling windows looking out to sea.', terrace: '84 m² outdoors: dining, lounge and sun deck.', bed3: 'Two single beds and a window onto the terrace.', bed2: 'Two single beds and built-in wardrobes.', bedroom: 'Main bedroom with dressing room and en-suite bathroom.', hall: 'A generous entrance hall that leads to every room.', home: 'Three bedrooms and terraces on two sides, right on the seafront.' },
  fr: { sea: 'Le séjour s’ouvre entièrement sur la terrasse et la mer.', kitchenR: 'Îlot en marbre, ouvert sur le séjour et la terrasse.', dining: 'Une table pour six près de la baie, la terrasse juste à côté.', living: 'Des baies du sol au plafond face à la mer.', terrace: '84 m² extérieurs : repas, salon et solarium.', bed3: 'Deux lits simples et une baie sur la terrasse.', bed2: 'Deux lits simples et des placards intégrés.', bedroom: 'Chambre principale avec dressing et salle de bains privée.', hall: 'Une entrée généreuse qui dessert tout le logement.', home: 'Trois chambres et des terrasses sur deux façades, en front de mer.' },
  de: { sea: 'Der Wohnraum öffnet sich ganz zur Terrasse und zum Meer.', kitchenR: 'Marmorinsel, offen zum Wohnraum und zur Terrasse.', dining: 'Ein Tisch für sechs am Fenster, die Terrasse direkt daneben.', living: 'Raumhohe Fenster mit Blick aufs Meer.', terrace: '84 m² im Freien: Essplatz, Lounge und Sonnendeck.', bed3: 'Zwei Einzelbetten und ein Fenster zur Terrasse.', bed2: 'Zwei Einzelbetten und Einbauschränke.', bedroom: 'Hauptschlafzimmer mit Ankleide und eigenem Bad.', hall: 'Eine großzügige Diele, die alle Räume erschließt.', home: 'Drei Schlafzimmer und Terrassen an zwei Seiten, direkt am Meer.' },
};
const LN = LINES[LANG] || LINES.es;
const FLY = 3.4, HOLD = 5.2, LIGHTS = ['morning', 'sunset', 'night'];
const tour = { on: false, i: 0, lap: 0, flyFrom: 0, holdFrom: 0, holdUntil: 0, from: null, to: null };
const tc = { box: document.getElementById('tourcap'), step: document.getElementById('tc-step'), name: document.getElementById('tc-name'), m2: document.getElementById('tc-m2'), line: document.getElementById('tc-line'), bar: document.getElementById('tc-bar') };
const tbtn = document.getElementById('tourbtn'), tbIcon = document.getElementById('tb-icon'), tbText = document.getElementById('tb-text');
const setBtn = () => { tbIcon.setAttribute('d', tour.on ? 'M3 2h2.4v8H3zM6.6 2H9v8H6.6z' : 'M3 2l7 4-7 4z'); tbText.textContent = t(tour.on ? 'stop' : 'tour'); tbtn.setAttribute('aria-pressed', tour.on); };
const easeIO = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
// each stop framed like a shot from just above the room: close in, tilted, the room filling the screen
// with its furniture and materials in the foreground (look-at point, turn, tilt from vertical, distance)
const SHOTS = {
  dining:   { look: [4.8, 0.5, 2.5],   az: 2.0,  pol: 0.82, r: 6.2 },  // the table for six, the palm, the glass to the terrace
  kitchenR: { look: [0.7, 0.7, -0.9],  az: 0.25, pol: 0.82, r: 5.6 },  // the island and stools, the run behind
  living:   { look: [3.7, 0.4, 6.7],   az: 2.55, pol: 0.86, r: 6.4 },  // the two sofas and the table, the glass and the sea beyond
  terrace:  { look: [7.9, 0.3, 3.6],   az: 1.0,  pol: 0.9,  r: 7.4 },  // the outdoor lounge and the loungers
  sea:      { look: [8.4, 1.0, 5.7],   az: -1.3, pol: 1.44, r: 6.4 },  // at eye level by the dining table, out over the terrace to the sea
  bed3:     { look: [-1.2, 0.4, 6.6],  az: -0.55, pol: 0.7, r: 5.8 },  // the twin beds from the glass side, over the wardrobes, headboards on the far wall
  bed2:     { look: [-8.3, 0.4, 7.75], az: 2.25, pol: 0.8,  r: 5.8 },  // the twin beds from their feet, the diagonal partition behind
  bedroom:  { look: [-9.9, 0.4, 9.7],  az: 0.8,  pol: 0.74, r: 6.2 },  // the main bed, the glass to its terrace
};
const viewOf = (room) => { if (!room) return { look: new THREE.Vector3(...HOME.look), az: HOME.az, pol: HOME.pol, r: HOME.r };
  const v = SHOTS[room.k] || room; return { look: new THREE.Vector3(...v.look), az: v.az, pol: v.pol, r: v.r * (phone ? (room.k === 'sea' ? 0.9 : 1.4) : 1) }; }; // (the sea's shot is at eye level: drawn back on a phone it stood behind a wall)
function tourGo(i, T = clock.getElapsedTime()) {
  tour.i = (i + TOUR.length) % TOUR.length; tour.holdUntil = 0; const room = TOUR[tour.i];
  focus = room; tagsEl.querySelectorAll('.tag').forEach((x) => x.classList.toggle('on', !!room && !!room.el && x === room.el));
  sph.setFromVector3(v3.copy(camera.position).sub(controls.target));
  tour.from = { look: controls.target.clone(), az: sph.theta, pol: sph.phi, r: sph.radius }; tour.to = viewOf(room);
  tour.flyFrom = T; flying = 0; tc.box.classList.remove('on');
}
// while walking, the camera may come down to eye level (the hand-held view stays above, as a model)
function startTour() { if (tour.on) return; controls.maxPolarAngle = 1.5; tour.on = true; tour.lap = 0; document.body.classList.add('touring'); setBtn(); hideHint(); tourGo(0); }
function stopTour() { if (!tour.on) return; tour.on = false; controls.maxPolarAngle = 1.2; if (sph.phi > 1.2) { sph.phi = 1.2; camera.position.setFromSpherical(sph).add(controls.target); } tour.holdUntil = 0; tour.to = null; document.body.classList.remove('touring'); setBtn(); tc.box.classList.remove('on'); poke(); }
tbtn.addEventListener('click', () => { if (tour.on) { stopTour(); focus = null; tagsEl.querySelectorAll('.tag').forEach((x) => x.classList.remove('on')); goTo(HOME); } else startTour(); });
addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); tbtn.click(); }
  else if (tour.on && (e.code === 'ArrowRight' || e.code === 'ArrowLeft')) tourGo(tour.i + (e.code === 'ArrowRight' ? 1 : -1));
});
setBtn();
// the flight itself, called from the loop; true while it holds the camera
function tourFrame(T, dt) {
  if (!tour.on || !tour.to) return false;
  const f = tour.from, g = tour.to;
  if (!tour.holdUntil) {
    const u = Math.min(1, (T - tour.flyFrom) / FLY), e = easeIO(u), lift = Math.sin(Math.PI * u);
    let dAz = g.az - f.az; dAz = Math.atan2(Math.sin(dAz), Math.cos(dAz));
    controls.target.lerpVectors(f.look, g.look, e);
    // an arc, not a slide: higher and further back half-way, settling as it arrives
    // between rooms it rises and draws back (more for longer moves), so it never cuts through a wall
    const reach = Math.min(1, f.look.distanceTo(g.look) / 8);
    sph.set(THREE.MathUtils.lerp(f.r, g.r, e) * (1 + (0.35 + 0.5 * reach) * lift), Math.max(0.3, THREE.MathUtils.lerp(f.pol, g.pol, e) - (0.2 + 0.25 * reach) * lift), f.az + dAz * e);
    camera.position.setFromSpherical(sph).add(controls.target);
    if (u >= 1) { // arrived: name the room and hold
      tour.holdFrom = T; tour.holdUntil = T + HOLD; const room = TOUR[tour.i];
      tc.step.textContent = room ? `${String(tour.i + 1).padStart(2, '0')} — ${String(TOUR.length - 1).padStart(2, '0')}` : t('cap').split('·')[0].trim();
      tc.name.textContent = room ? t(room.k) : 'The Sapphire';
      tc.m2.textContent = room ? `${room.m2} m²` : t('cap').split('·').pop().trim();
      tc.line.textContent = LN[room ? room.k : 'home'];
      tc.box.classList.add('on');
      // the end of a lap, on the sales screen only: the light moves on to the next hour
      if (!room && AUTO) { tour.lap++; const h = LIGHTS[tour.lap % LIGHTS.length]; if (STATE.light !== h) choose('light', h); }
    }
    return true;
  }
  // held: a slow turn, so the walk never stands still
  sph.setFromVector3(v3.copy(camera.position).sub(controls.target)); sph.theta += 0.04 * dt; sph.radius *= 1 - 0.012 * dt; // a slow turn and a slow push in
  camera.position.setFromSpherical(sph).add(controls.target);
  tc.bar.style.transform = `scaleX(${Math.min(1, (T - tour.holdFrom) / HOLD).toFixed(3)})`;
  if (T > tour.holdUntil) tourGo(tour.i + 1, T);
  return true;
}
if (AUTO) setTimeout(startTour, 4200);
const setSph = (az, pol, r) => { sph.set(r, pol, az); camera.position.setFromSpherical(sph).add(controls.target); };
controls.target.set(...HOME.look);
setSph(HOME.az - 0.9, 0.55, HOME.r * 1.9);
controls.addEventListener('start', () => { flying = 0; stopTour(); poke(); hideHint(); });

const clock = new THREE.Clock();
let idleAt = 0;
function poke() { idleAt = clock.getElapsedTime() + 6; }
let hintOff = false;
const hideHint = () => { if (!hintOff) { hintOff = true; document.getElementById('hint').style.opacity = 0; } };
// (counted from when the viewer is first on screen: inside the site's page it loads long before it is scrolled to)
{ const io = new IntersectionObserver((es) => { if (es.some((e) => e.isIntersecting)) { io.disconnect(); setTimeout(hideHint, 6000); } });
  io.observe(document.body); }

/* ================= size ================= */
function fit() {
  const w = stage.clientWidth || innerWidth, h = stage.clientHeight || innerHeight;
  renderer.setSize(w, h); camera.aspect = w / h;
  if (composer) { composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(w, h); }
  const tall = w / h < 0.9;
  camera.fov = tall ? 50 : 32;
  camera.updateProjectionMatrix();
  // tall frames (phones): seen more from above, so the plan's depth fills the screen's height, and drawn
  // back just far enough for the whole floor's width (some 27 m across) to fit between the edges
  // and turned a quarter round, so the floor's long side (bedrooms to terrace) runs up the screen and its
  // short side, some 16 m, is what has to fit across
  HOME.pol = tall ? 0.55 : 0.9;
  // bare (the studio page): from the terrace's side, three-quarters on, rather than straight at the glass
  HOME.az = tall ? 0.62 + 1.5 : BARE ? 1.3 : 0.62;
  HOME.r = tall ? Math.max(30, 9.8 / (Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * (w / h))) : w / h < 1.3 ? 34 : BARE ? 30 : 26.5; // wide screens: closer in, the home filling the frame (bare a touch back, so the terrace stays whole)
  // tall frames: aimed at the floor's middle; wide ones a little low, so the home sits higher, clear of the controls (none when bare)
  HOME.look[1] = tall ? 0 : BARE ? 0.2 : -0.9;
  if (!focus) { goal.look.set(...HOME.look); controls.target.set(...HOME.look); goal.r = HOME.r; }
}
addEventListener('resize', fit); fit();



/* ================= loop ================= */
const v3 = new THREE.Vector3();
let introAt = null, lastT = null, landed = false;
const ease = (x) => (x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x));
function frame() {
  const T = clock.getElapsedTime();
  if (introAt === null) introAt = T;
  // the change of hour, over its own time whatever the frame rate
  if (mixT < 1) { if (mixFrom < 0) mixFrom = T; mixT = Math.min(1, (T - mixFrom) / 1.3); applyHour(); }

  const it = reduced ? 1 : ease((T - introAt) / 2.8);
  // easing per frame, by elapsed time: the same glide on a slow phone as on a fast screen
  const dt = Math.min(0.25, T - (lastT ?? T)); lastT = T; const k = 1 - Math.pow(0.02, dt);
  const touring = it >= 1 && landed && tourFrame(T, dt);
  if (it < 1) { flying = 0; landed = false; setSph(HOME.az - 0.9 * (1 - it), 0.55 + (HOME.pol - 0.55) * it, HOME.r * (1.9 - 0.9 * it)); }
  // the flight in always lands where it should, however few frames it had
  else if (!landed) { landed = true; setSph(HOME.az, HOME.pol, HOME.r); }
  else if (flying && !tour.on) {
    controls.target.lerp(goal.look, k);
    sph.setFromVector3(v3.copy(camera.position).sub(controls.target));
    let dAz = goal.az - sph.theta; dAz = Math.atan2(Math.sin(dAz), Math.cos(dAz));
    sph.theta += dAz * k; sph.phi += (goal.pol - sph.phi) * k; sph.radius += (goal.r - sph.radius) * k;
    camera.position.setFromSpherical(sph).add(controls.target);
    if (Math.abs(dAz) < 0.002 && Math.abs(goal.r - sph.radius) < 0.02 && controls.target.distanceTo(goal.look) < 0.01) flying = 0;
  } else if (touring) {
    // the walk has the camera
  } else if (BARE && !reduced) {
    // bare: a slow sway either side of a three-quarter view from the terrace's side, never round to the back
    sph.setFromVector3(v3.copy(camera.position).sub(controls.target));
    sph.theta += ((HOME.az + Math.sin(T * 0.12) * 0.32) - sph.theta) * Math.min(1, dt * 1.5);
    camera.position.setFromSpherical(sph).add(controls.target);
  } else if (!reduced && !focus && T > idleAt) {
    sph.setFromVector3(v3.copy(camera.position).sub(controls.target));
    sph.theta += ((HOME.az + Math.sin(T * 0.11) * 0.38) - sph.theta) * 0.008;
    camera.position.setFromSpherical(sph).add(controls.target);
  }
  controls.update();

  const w = renderer.domElement.clientWidth, h = renderer.domElement.clientHeight;
  ROOMS.forEach((room) => {
    if (!room.el) return;
    v3.set(...room.at).project(camera);
    const off = v3.z > 1 || Math.abs(v3.x) > 1.05 || Math.abs(v3.y) > 1.05 || it < 0.9;
    room.el.classList.toggle('hide', off);
    // kept whole on screen: a tag near an edge slides in rather than being cut (its pin stays on the room)
    if (!off) { const half = (room.el.offsetWidth || 90) / 2 + 8, px = Math.min(w - half, Math.max(half, ((v3.x + 1) / 2) * w));
      room.el.style.transform = `translate(${px}px, ${((1 - v3.y) / 2) * h}px) translate(-50%, -100%)`; }
  });
  if (mixT < 1) redrawShadows(1);
  if (shadowDirty > 0) { renderer.shadowMap.needsUpdate = true; shadowDirty--; }
  draw();
}

/* Run only while the page holding it says it is on screen; the flight in waits for that first sight */
let seen = false;
addEventListener('message', (e) => {
  if (e.data && typeof e.data.fhVisible === 'boolean') {
    if (e.data.fhVisible && !seen) { seen = true; introAt = null; }
    renderer.setAnimationLoop(e.data.fhVisible ? frame : null);
  }
});
applyHour(); setFloor(STATE.floor); setKitchen(STATE.kitchen);
stage.classList.add('on');
// the loader goes once the models are in (or after a while, if one never comes)
{ const lo = document.getElementById('loader'), bar = document.getElementById('bar'); let done = false;
  const finish = () => { if (done) return; done = true; bar.style.transform = 'scaleX(1)'; setTimeout(() => lo.classList.add('gone'), 350); redrawShadows(); };
  THREE.DefaultLoadingManager.onProgress = (_, n, total) => { bar.style.transform = `scaleX(${(n / Math.max(total, 1)).toFixed(3)})`; };
  THREE.DefaultLoadingManager.onLoad = finish; THREE.DefaultLoadingManager.onError = () => {};
  setTimeout(finish, 6000); }
renderer.setAnimationLoop(frame);
</script>
