<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Sapphire — la vivienda en 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jura:wght@300;400;500&family=JetBrains+Mono:wght@300;400;500&display=swap">
<style>
/* The Sapphire's own light: warm stone, pale oak, white linen, the sea beyond, sapphire blue for accents */
:root {
  --ground: #e9e3d9;
  --ink: #1d2230;
  --soft: rgba(29, 34, 48, 0.6);
  --sapphire: #1f3fa6;
  --glass: rgba(255, 255, 255, 0.62);
  --display: 'Jura', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; }
body { background: var(--ground); color: var(--ink); overflow: hidden; -webkit-tap-highlight-color: transparent; }
#stage { position: fixed; inset: 0; opacity: 0; transition: opacity 1.2s ease; }
#stage.on { opacity: 1; }
#stage canvas { display: block; width: 100%; height: 100%; }

.cap, .hint { position: fixed; top: 16px; font-family: var(--mono); font-size: 12px; letter-spacing: 0.03em; color: var(--soft); pointer-events: none; margin: 0; transition: color 1.2s, opacity .6s; }
.cap { left: 22px; }
.cap b { font-weight: 400; color: var(--ink); transition: color 1.2s; }
.hint { right: 18px; display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 99px; background: rgba(29, 34, 48, 0.42); color: #f4f1ec; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.hint svg { width: 15px; height: 15px; animation: sway 1.8s ease-in-out infinite; }
@keyframes sway { 0%, 100% { transform: translateX(-3px) rotate(-8deg); } 50% { transform: translateX(3px) rotate(8deg); } }
body.night .cap, body.night .cap b { color: rgba(244, 241, 236, 0.85); }

/* The rooms: a quiet tag on each, as on the plan, that takes the camera there */
.tag { position: fixed; left: 0; top: 0; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 2px; font-family: var(--mono); font-size: 11px; letter-spacing: .04em; color: var(--ink); background: var(--glass); border: 1px solid rgba(255,255,255,.75); padding: 5px 10px 6px; border-radius: 10px; backdrop-filter: blur(10px) saturate(1.2); -webkit-backdrop-filter: blur(10px) saturate(1.2); box-shadow: 0 8px 24px rgba(30, 36, 50, .12); cursor: pointer; white-space: nowrap; transition: opacity .5s, background .3s; user-select: none; }
.tag::after { content: ''; position: absolute; left: 50%; bottom: -9px; width: 1px; height: 8px; background: rgba(29, 34, 48, .45); }
.tag small { font-size: 10px; color: var(--soft); }
.tag:hover, .tag.on { background: rgba(255, 255, 255, .9); }
.tag.on { box-shadow: 0 0 0 1.5px var(--sapphire), 0 8px 24px rgba(30, 36, 50, .16); }
.tag.hide { opacity: 0; pointer-events: none; }

/* The controls: one pane of frosted glass at the foot */
.panel { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 18px; align-items: center; padding: 8px 10px; border-radius: 16px; background: var(--glass); border: 1px solid rgba(255,255,255,.8); backdrop-filter: blur(14px) saturate(1.25); -webkit-backdrop-filter: blur(14px) saturate(1.25); box-shadow: 0 14px 40px rgba(30, 36, 50, .14); font-family: var(--mono); font-size: 11.5px; max-width: calc(100vw - 24px); box-sizing: border-box; }
.group { display: flex; align-items: center; gap: 4px; }
.group > span { color: var(--soft); margin: 0 6px 0 4px; letter-spacing: .04em; }
.group button { font: inherit; letter-spacing: .03em; color: var(--ink); background: transparent; border: 0; padding: 7px 11px; border-radius: 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; transition: background .25s, color .25s; }
.group button:hover { background: rgba(29, 34, 48, .06); }
.group button.on { background: var(--ink); color: #f4f1ec; }
.sw { width: 11px; height: 11px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); flex: none; }
.sep { width: 1px; align-self: stretch; background: rgba(29, 34, 48, .12); }

/* phones: one row, each setting a pill that steps through its options at a tap */
.cycle { display: none; }
@media (max-width: 760px) {
  .cap { left: 12px; top: 12px; font-size: 10.5px; max-width: 62%; }
  .hint { right: 10px; top: 10px; font-size: 10.5px; padding: 5px 10px; }
  .panel { left: 10px; right: 10px; transform: none; bottom: 10px; gap: 6px; padding: 6px; font-size: 10.5px; justify-content: space-between; }
  .group, .sep { display: none; }
  .cycle { display: flex; flex: 1; flex-direction: column; align-items: flex-start; gap: 1px; font: inherit; color: var(--ink); background: rgba(255,255,255,.55); border: 0; border-radius: 10px; padding: 6px 9px 7px; cursor: pointer; min-width: 0; }
  .cycle small { font-size: 9.5px; color: var(--soft); letter-spacing: .04em; }
  .cycle b { font-weight: 400; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .tag { font-size: 10px; padding: 4px 8px 5px; }
  .tag small { font-size: 9px; }
}
</style>
</head>
<body>

<div id="stage"></div>
<p class="cap" id="cap"><b>The Sapphire</b> · <span id="cap-text"></span></p>
<p class="hint" id="hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11m0-1.5a1.5 1.5 0 0 1 3 0V11m0-.5a1.5 1.5 0 0 1 3 0v4.5a6 6 0 0 1-6 6h-.6a6 6 0 0 1-4.6-2.2L4.3 15.6a1.5 1.5 0 0 1 2.2-2l2.5 2.4"/></svg><span id="hint-text"></span></p>
<div id="tags"></div>
<div class="panel" id="panel">
  <div class="group" data-k="light"><span id="l-light"></span></div>
  <div class="sep"></div>
  <div class="group" data-k="floor"><span id="l-floor"></span></div>
  <div class="sep"></div>
  <div class="group" data-k="kitchen"><span id="l-kitchen"></span></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ================= words ================= */
const LANG = (() => { try { const l = localStorage.getItem('fugahaus.lang'); if (l) return l; } catch (e) {} return (navigator.language || 'es').slice(0, 2); })();
const DICT = {
  es: { cap: 'Concepto · Planta 2C, la vivienda en 3D', drag: 'arrastra para girar', swipe: 'desliza para girar', light: 'luz', floor: 'suelo', kitchen: 'cocina',
        morning: 'mañana', sunset: 'atardecer', night: 'noche', stone: 'travertino', oak: 'roble', white: 'blanco', sapphire: 'zafiro',
        living: 'Salón comedor', kitchenR: 'Cocina', hall: 'Hall', terrace: 'Terraza', laundry: 'Lavadero', bedroom: 'Dormitorio 1' },
  en: { cap: 'Concept · Floor 2C, the home in 3D', drag: 'drag to rotate', swipe: 'swipe to rotate', light: 'light', floor: 'floor', kitchen: 'kitchen',
        morning: 'morning', sunset: 'sunset', night: 'night', stone: 'travertine', oak: 'oak', white: 'white', sapphire: 'sapphire',
        living: 'Living & dining', kitchenR: 'Kitchen', hall: 'Hall', terrace: 'Terrace', laundry: 'Laundry', bedroom: 'Main bedroom' },
  fr: { cap: 'Concept · Étage 2C, le logement en 3D', drag: 'faites glisser pour tourner', swipe: 'glissez pour tourner', light: 'lumière', floor: 'sol', kitchen: 'cuisine',
        morning: 'matin', sunset: 'couchant', night: 'nuit', stone: 'travertin', oak: 'chêne', white: 'blanc', sapphire: 'saphir',
        living: 'Séjour', kitchenR: 'Cuisine', hall: 'Entrée', terrace: 'Terrasse', laundry: 'Buanderie', bedroom: 'Chambre 1' },
  de: { cap: 'Konzept · Etage 2C, die Wohnung in 3D', drag: 'ziehen zum Drehen', swipe: 'wischen zum Drehen', light: 'licht', floor: 'boden', kitchen: 'küche',
        morning: 'morgen', sunset: 'abend', night: 'nacht', stone: 'travertin', oak: 'eiche', white: 'weiß', sapphire: 'saphir',
        living: 'Wohnen & Essen', kitchenR: 'Küche', hall: 'Diele', terrace: 'Terrasse', laundry: 'Waschraum', bedroom: 'Schlafzimmer 1' },
};
const TX = DICT[LANG] || DICT.es;
const t = (k) => TX[k] ?? DICT.es[k] ?? k;
const touch = matchMedia('(pointer: coarse)').matches;
const phone = innerWidth < 760;
document.getElementById('cap-text').textContent = t('cap');
document.getElementById('hint-text').textContent = t(touch ? 'swipe' : 'drag');
['light', 'floor', 'kitchen'].forEach((k) => (document.getElementById('l-' + k).textContent = t(k)));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= renderer, scene ================= */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, phone ? 1.6 : 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const aniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.5;

const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 400);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.enablePan = false; controls.enableZoom = false;
controls.minPolarAngle = 0.4; controls.maxPolarAngle = 1.2;
controls.rotateSpeed = 0.6;
renderer.domElement.style.touchAction = 'pan-y';

/* ================= textures, drawn once ================= */
let seed = 11; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const tex = (w, h, draw, repeat, color = true) => {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); if (color) t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = aniso;
  if (repeat) t.repeat.set(repeat[0], repeat[1]);
  return t;
};
// travertine: large warm slabs (1.2 m), soft banded veins, fine joints
const stoneTex = tex(1024, 1024, (x, w, h) => {
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
    const l = 84 + rnd() * 5;
    x.fillStyle = `hsl(35, 32%, ${l}%)`; x.fillRect(i * w / 2, j * h / 2, w / 2, h / 2);
    for (let v = 0; v < 60; v++) {
      x.strokeStyle = `rgba(${150 + rnd() * 30},${118 + rnd() * 20},${84 + rnd() * 15},${.04 + rnd() * .08})`; x.lineWidth = 1 + rnd() * 4;
      const y0 = j * h / 2 + rnd() * h / 2; x.beginPath(); x.moveTo(i * w / 2, y0);
      for (let k = 1; k <= 6; k++) x.lineTo(i * w / 2 + (k * w) / 12, y0 + (rnd() - .5) * 10);
      x.stroke();
    }
    for (let p = 0; p < 160; p++) { x.fillStyle = `rgba(140,110,80,${rnd() * .18})`; x.beginPath(); x.ellipse(i * w / 2 + rnd() * w / 2, j * h / 2 + rnd() * h / 2, 1 + rnd() * 5, 1 + rnd() * 2, 0, 0, 7); x.fill(); }
  }
  x.fillStyle = 'rgba(130,108,82,.45)'; x.fillRect(0, h / 2 - 1, w, 2); x.fillRect(w / 2 - 1, 0, 2, h); x.fillRect(0, 0, w, 1); x.fillRect(0, 0, 1, h);
});
// oak: long wide planks, soft grain, a little colour from board to board
const oakTex = tex(1024, 1024, (x, w, h) => {
  const n = 6, pw = w / n;
  for (let i = 0; i < n; i++) {
    let y = -rnd() * 400;
    while (y < h) {
      const len = 380 + rnd() * 420, hue = 30 + rnd() * 5, lig = 56 + rnd() * 9;
      x.fillStyle = `hsl(${hue}, ${36 + rnd() * 8}%, ${lig}%)`; x.fillRect(i * pw, y, pw, len);
      for (let g = 0; g < 22; g++) { x.strokeStyle = `rgba(105,68,38,${.04 + rnd() * .08})`; x.lineWidth = 1 + rnd(); const gx = i * pw + rnd() * pw; x.beginPath(); x.moveTo(gx, y); x.bezierCurveTo(gx + rnd() * 8 - 4, y + len / 3, gx + rnd() * 8 - 4, y + len * .66, gx + rnd() * 6 - 3, y + len); x.stroke(); }
      if (rnd() < .5) { x.strokeStyle = 'rgba(95,60,35,.18)'; x.lineWidth = 2; x.beginPath(); x.ellipse(i * pw + rnd() * pw, y + rnd() * len, 6, 14, 0, 0, 7); x.stroke(); }
      x.fillStyle = 'rgba(80,52,30,.35)'; x.fillRect(i * pw, y, pw, 2);
      y += len;
    }
    x.fillStyle = 'rgba(80,52,30,.32)'; x.fillRect(i * pw, 0, 2, h);
  }
});
// outdoor porcelain: big pale slabs, open joints
const deckTex = tex(512, 512, (x, w, h) => {
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) { x.fillStyle = `hsl(38, 18%, ${84 + rnd() * 4}%)`; x.fillRect(i * w / 2, j * h / 2, w / 2, h / 2);
    for (let p = 0; p < 300; p++) { x.fillStyle = `rgba(120,105,85,${rnd() * .07})`; x.fillRect(i * w / 2 + rnd() * w / 2, j * h / 2 + rnd() * h / 2, 2, 2); } }
  x.fillStyle = 'rgba(110,95,78,.55)'; x.fillRect(0, h / 2 - 2, w, 4); x.fillRect(w / 2 - 2, 0, 4, h); x.fillRect(0, 0, w, 2); x.fillRect(0, 0, 2, h);
});
// the bathrooms' porcelain: pale grey large tiles, fine joints
const tileTex = tex(512, 512, (x, w, h) => { const n = 4, t = w / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { x.fillStyle = `hsl(205, 6%, ${80 + rnd() * 4}%)`; x.fillRect(i * t, j * t, t, t);
    for (let p = 0; p < 120; p++) { x.fillStyle = `rgba(90,100,110,${rnd() * .06})`; x.fillRect(i * t + rnd() * t, j * t + rnd() * t, 2, 2); } }
  x.fillStyle = 'rgba(120,128,135,.6)'; for (let i = 0; i <= n; i++) { x.fillRect(i * t - 1, 0, 2, h); x.fillRect(0, i * t - 1, w, 2); } });
// white marble for the worktops
const marbleTex = tex(512, 512, (x, w, h) => { x.fillStyle = '#f4f2ee'; x.fillRect(0, 0, w, h);
  for (let v = 0; v < 14; v++) { x.strokeStyle = `rgba(150,150,155,${.08 + rnd() * .18})`; x.lineWidth = .6 + rnd() * 1.8; x.beginPath(); let px = rnd() * w, py = 0; x.moveTo(px, py); while (py < h) { px += (rnd() - .45) * 40; py += 20 + rnd() * 30; x.lineTo(px, py); } x.stroke(); } }, [1, 1]);
// woven linen and boucle, for the upholstery (tinted per piece)
const weaveTex = tex(256, 256, (x, w, h) => { x.fillStyle = '#ffffff'; x.fillRect(0, 0, w, h);
  for (let i = 0; i < w; i += 2) { x.fillStyle = `rgba(0,0,0,${.03 + rnd() * .04})`; x.fillRect(i, 0, 1, h); x.fillRect(0, i, w, 1); }
  for (let i = 0; i < 1600; i++) { x.fillStyle = `rgba(0,0,0,${rnd() * .07})`; x.fillRect(rnd() * w, rnd() * h, 2, 1); } }, [4, 4]);
// the living room's rug: wool, a quiet border
const rugTex = tex(512, 512, (x, w, h) => { x.fillStyle = '#e3d7c3'; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) { x.fillStyle = `rgba(${120 + rnd() * 60},${100 + rnd() * 40},${80 + rnd() * 30},${rnd() * .12})`; x.fillRect(rnd() * w, rnd() * h, 2, 2); }
  x.strokeStyle = 'rgba(150,110,80,.5)'; x.lineWidth = 6; x.strokeRect(26, 26, w - 52, h - 52); x.lineWidth = 2; x.strokeRect(42, 42, w - 84, h - 84); });
// plaster for the walls
const plasterTex = tex(256, 256, (x, w, h) => { x.fillStyle = '#ffffff'; x.fillRect(0, 0, w, h); for (let i = 0; i < 2500; i++) { x.fillStyle = `rgba(0,0,0,${rnd() * .035})`; x.fillRect(rnd() * w, rnd() * h, 2 + rnd() * 3, 1 + rnd() * 2); } }, [2, 2]);
// a leaf, cut out: a soft lance with its midrib and a little shading
const leafTex = (hue, sat, lig, shape = 'lance') => tex(128, 256, (x, w, h) => {
  x.clearRect(0, 0, w, h);
  const g = x.createLinearGradient(0, 0, w, 0); g.addColorStop(0, `hsl(${hue},${sat}%,${lig - 8}%)`); g.addColorStop(.5, `hsl(${hue},${sat}%,${lig + 4}%)`); g.addColorStop(1, `hsl(${hue},${sat}%,${lig - 10}%)`);
  x.fillStyle = g; x.beginPath();
  if (shape === 'lance') { x.moveTo(w / 2, h); x.bezierCurveTo(w * 1.05, h * .7, w * .85, h * .2, w / 2, 0); x.bezierCurveTo(w * .15, h * .2, -w * .05, h * .7, w / 2, h); }
  else { x.moveTo(w / 2, h); x.bezierCurveTo(w * 1.2, h * .65, w * .95, h * .05, w / 2, 0); x.bezierCurveTo(w * .05, h * .05, -w * .2, h * .65, w / 2, h); }
  x.fill(); x.strokeStyle = `hsla(${hue},${sat - 10}%,${lig + 18}%,.6)`; x.lineWidth = 2; x.beginPath(); x.moveTo(w / 2, h); x.lineTo(w / 2, 4); x.stroke();
});

/* ================= materials ================= */
const fabric = (c, rough = .95) => new THREE.MeshStandardMaterial({ map: weaveTex, color: c, roughness: rough });
const M = {
  wall: new THREE.MeshStandardMaterial({ map: plasterTex, color: '#f3eee6', roughness: .93 }),
  wallTop: new THREE.MeshStandardMaterial({ color: '#c8bfb2', roughness: 1 }),
  stone: new THREE.MeshStandardMaterial({ map: stoneTex, roughness: .5 }),
  bathFloor: new THREE.MeshStandardMaterial({ map: tileTex, roughness: .35 }),
  porcelain: new THREE.MeshStandardMaterial({ color: '#fbfbfa', roughness: .18 }),
  oak: new THREE.MeshStandardMaterial({ map: oakTex, roughness: .58 }),
  deck: new THREE.MeshStandardMaterial({ map: deckTex, roughness: .78 }),
  slabSide: new THREE.MeshStandardMaterial({ color: '#e9e3d9', roughness: .9 }),
  wood: new THREE.MeshStandardMaterial({ map: oakTex, color: '#f0dcc2', roughness: .55 }),
  teak: new THREE.MeshStandardMaterial({ map: oakTex, color: '#c79a6b', roughness: .65 }),
  walnut: new THREE.MeshStandardMaterial({ map: oakTex, color: '#8e6446', roughness: .5 }),
  marble: new THREE.MeshStandardMaterial({ map: marbleTex, roughness: .22 }),
  travertine: new THREE.MeshStandardMaterial({ map: stoneTex, color: '#fbf3e6', roughness: .42 }),
  bronze: new THREE.MeshStandardMaterial({ color: '#8a6d4c', roughness: .35, metalness: .75 }),
  black: new THREE.MeshStandardMaterial({ color: '#232323', roughness: .4, metalness: .3 }),
  frame: new THREE.MeshStandardMaterial({ color: '#4b4038', roughness: .4, metalness: .6 }),
  sill: new THREE.MeshStandardMaterial({ color: '#ddd4c6', roughness: .7 }),
  glass: new THREE.MeshStandardMaterial({ color: '#a9c7c4', roughness: .04, metalness: .1, transparent: true, opacity: .26, depthWrite: false }),
  rail: new THREE.MeshStandardMaterial({ color: '#eef8f9', roughness: .02, transparent: true, opacity: .13, depthWrite: false }),
  front: new THREE.MeshStandardMaterial({ color: '#f1ede6', roughness: .45 }),
  steel: new THREE.MeshStandardMaterial({ color: '#cfd1d2', roughness: .25, metalness: .9 }),
  rug: new THREE.MeshStandardMaterial({ map: rugTex, roughness: 1 }),
  // upholstery, in the warm, sun-washed colours of the coast
  sofa: fabric('#e8e0d2'), sand: fabric('#d9c7a8'), terracotta: fabric('#b9643f'), olive: fabric('#7d7a4a'), ochre: fabric('#c99a45'),
  navy: fabric('#2f3f63'), sky: fabric('#9fb8c9'), rust: fabric('#a05a3c'), cream: fabric('#f4efe6'), rattan: new THREE.MeshStandardMaterial({ map: weaveTex, color: '#c6a170', roughness: .9 }),
  leather: new THREE.MeshStandardMaterial({ color: '#8a5a36', roughness: .55 }),
  ceramic: new THREE.MeshStandardMaterial({ color: '#efe9df', roughness: .35 }),
  ceramicBlue: new THREE.MeshStandardMaterial({ color: '#2e4f8f', roughness: .3 }),
  terracottaPot: new THREE.MeshStandardMaterial({ color: '#b06f4a', roughness: .85 }),
  planter: new THREE.MeshStandardMaterial({ color: '#d8cfc0', roughness: .9 }),
  soil: new THREE.MeshStandardMaterial({ color: '#5b4636', roughness: 1 }),
  bark: new THREE.MeshStandardMaterial({ color: '#7d6b58', roughness: .95 }),
  palmTrunk: new THREE.MeshStandardMaterial({ color: '#8a7a64', roughness: 1 }),
  lamp: new THREE.MeshStandardMaterial({ color: '#fff3dc', emissive: '#ffcf8a', emissiveIntensity: 0, roughness: .6 }),
  screen: new THREE.MeshStandardMaterial({ color: '#111214', roughness: .2, metalness: .4 }),
  book: [fabric('#9b3f2f', .8), fabric('#2f4a6b', .8), fabric('#d8c9a8', .8), fabric('#5f6b4b', .8)],
  art: new THREE.MeshStandardMaterial({ color: '#e9dcc8', roughness: .9 }),
};
M.deck.map.repeat.set(1, 1);
const leafMat = (hue, sat, lig, shape) => new THREE.MeshStandardMaterial({ map: leafTex(hue, sat, lig, shape), alphaTest: 0.5, side: THREE.DoubleSide, roughness: .75 });
const LEAF = { olive: leafMat(95, 14, 52), palm: leafMat(98, 34, 36), shrub: leafMat(105, 28, 34, 'round'), fig: leafMat(110, 32, 30, 'round'), kentia: leafMat(96, 38, 32) };

/* ================= helpers ================= */
const house = new THREE.Group(); scene.add(house);
const add = (mesh, cast = true, receive = true, parent = house) => { mesh.castShadow = cast; mesh.receiveShadow = receive; parent.add(mesh); return mesh; };

const sph = new THREE.Spherical(), goal = { look: new THREE.Vector3(...HOME.look), az: HOME.az, pol: HOME.pol, r: HOME.r };
let flying = 0;
function goTo(v) { goal.look.set(...v.look); goal.az = v.az; goal.pol = v.pol; goal.r = v.r * (phone && v !== HOME ? 1.3 : 1); flying = 1; }
const setSph = (az, pol, r) => { sph.set(r, pol, az); camera.position.setFromSpherical(sph).add(controls.target); };
controls.target.set(...HOME.look);
setSph(HOME.az - 0.9, 0.55, HOME.r * 1.9);
controls.addEventListener('start', () => { flying = 0; poke(); hideHint(); });

const clock = new THREE.Clock();
let idleAt = 0;
function poke() { idleAt = clock.getElapsedTime() + 6; }
let hintOff = false;
const hideHint = () => { if (!hintOff) { hintOff = true; document.getElementById('hint').style.opacity = 0; } };
setTimeout(hideHint, 5000);

/* ================= size ================= */
function fit() {
  const w = stage.clientWidth || innerWidth, h = stage.clientHeight || innerHeight;
  renderer.setSize(w, h); camera.aspect = w / h;
  const tall = w / h < 0.9;
  camera.fov = tall ? 44 : 32;
  camera.updateProjectionMatrix();
  HOME.r = tall ? 33 : w / h < 1.3 ? 34 : 30;
  // tall frames: aimed a little above the floor, so it sits in the space over the controls
  HOME.look[1] = tall ? 1.6 : 0.2;
  if (!focus) { goal.look.set(...HOME.look); controls.target.set(...HOME.look); goal.r = HOME.r; }
}
addEventListener('resize', fit); fit();

/* ================= loop ================= */
const v3 = new THREE.Vector3();
let introAt = null, lastT = null, landed = false;
const ease = (x) => (x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x));
function frame() {
  const T = clock.getElapsedTime();
  if (introAt === null) introAt = T;
  // the change of hour, over its own time whatever the frame rate
  if (mixT < 1) { if (mixFrom < 0) mixFrom = T; mixT = Math.min(1, (T - mixFrom) / 1.3); applyHour(); }

  const it = reduced ? 1 : ease((T - introAt) / 2.8);
  // easing per frame, by elapsed time: the same glide on a slow phone as on a fast screen
  const dt = Math.min(0.25, T - (lastT ?? T)); lastT = T; const k = 1 - Math.pow(0.02, dt);
  if (it < 1) { flying = 0; landed = false; setSph(HOME.az - 0.9 * (1 - it), 0.55 + (HOME.pol - 0.55) * it, HOME.r * (1.9 - 0.9 * it)); }
  // the flight in always lands where it should, however few frames it had
  else if (!landed) { landed = true; setSph(HOME.az, HOME.pol, HOME.r); }
  else if (flying) {
    controls.target.lerp(goal.look, k);
    sph.setFromVector3(v3.copy(camera.position).sub(controls.target));
    let dAz = goal.az - sph.theta; dAz = Math.atan2(Math.sin(dAz), Math.cos(dAz));
    sph.theta += dAz * k; sph.phi += (goal.pol - sph.phi) * k; sph.radius += (goal.r - sph.radius) * k;
    camera.position.setFromSpherical(sph).add(controls.target);
    if (Math.abs(dAz) < 0.002 && Math.abs(goal.r - sph.radius) < 0.02 && controls.target.distanceTo(goal.look) < 0.01) flying = 0;
  } else if (!reduced && !focus && T > idleAt) {
    sph.setFromVector3(v3.copy(camera.position).sub(controls.target));
    sph.theta += ((HOME.az + Math.sin(T * 0.11) * 0.38) - sph.theta) * 0.008;
    camera.position.setFromSpherical(sph).add(controls.target);
  }
  controls.update();

  const w = renderer.domElement.clientWidth, h = renderer.domElement.clientHeight;
  ROOMS.forEach((room) => {
    if (!room.el) return;
    v3.set(...room.at).project(camera);
    const off = v3.z > 1 || Math.abs(v3.x) > 1.05 || Math.abs(v3.y) > 1.05 || it < 0.9;
    room.el.classList.toggle('hide', off);
    if (!off) room.el.style.transform = `translate(${((v3.x + 1) / 2) * w}px, ${((1 - v3.y) / 2) * h}px) translate(-50%, -100%)`;
  });
  renderer.render(scene, camera);
}

/* Run only while the page holding it says it is on screen; the flight in waits for that first sight */
let seen = false;
addEventListener('message', (e) => {
  if (e.data && typeof e.data.fhVisible === 'boolean') {
    if (e.data.fhVisible && !seen) { seen = true; introAt = null; }
    renderer.setAnimationLoop(e.data.fhVisible ? frame : null);
  }
});
applyHour(); setFloor('stone'); setKitchen('white');
stage.classList.add('on');
renderer.setAnimationLoop(frame);
</script>
</body>
</html>
