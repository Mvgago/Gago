<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Sapphire — la vivienda en 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jura:wght@300;400;500&family=JetBrains+Mono:wght@300;400;500&display=swap">
<style>
/* The Sapphire's own light: warm stone, pale oak, white linen, the sea beyond, sapphire blue for accents */
:root {
  --ground: #e9e3d9;
  --ink: #1d2230;
  --soft: rgba(29, 34, 48, 0.6);
  --sapphire: #1f3fa6;
  --glass: rgba(255, 255, 255, 0.62);
  --display: 'Jura', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; }
body { background: var(--ground); color: var(--ink); overflow: hidden; -webkit-tap-highlight-color: transparent; }
#stage { position: fixed; inset: 0; opacity: 0; transition: opacity 1.2s ease; }
#stage.on { opacity: 1; }
#stage canvas { display: block; width: 100%; height: 100%; }

.cap, .hint { position: fixed; top: 16px; font-family: var(--mono); font-size: 12px; letter-spacing: 0.03em; color: var(--soft); pointer-events: none; margin: 0; transition: color 1.2s, opacity .6s; }
.cap { left: 22px; }
.cap b { font-weight: 400; color: var(--ink); transition: color 1.2s; }
.hint { right: 18px; display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 99px; background: rgba(29, 34, 48, 0.42); color: #f4f1ec; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.hint svg { width: 15px; height: 15px; animation: sway 1.8s ease-in-out infinite; }
@keyframes sway { 0%, 100% { transform: translateX(-3px) rotate(-8deg); } 50% { transform: translateX(3px) rotate(8deg); } }
body.night .cap, body.night .cap b { color: rgba(244, 241, 236, 0.85); }

/* The rooms: a quiet tag on each, as on the plan, that takes the camera there */
.tag { position: fixed; left: 0; top: 0; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 2px; font-family: var(--mono); font-size: 11px; letter-spacing: .04em; color: var(--ink); background: var(--glass); border: 1px solid rgba(255,255,255,.75); padding: 5px 10px 6px; border-radius: 10px; backdrop-filter: blur(10px) saturate(1.2); -webkit-backdrop-filter: blur(10px) saturate(1.2); box-shadow: 0 8px 24px rgba(30, 36, 50, .12); cursor: pointer; white-space: nowrap; transition: opacity .5s, background .3s; user-select: none; }
.tag::after { content: ''; position: absolute; left: 50%; bottom: -9px; width: 1px; height: 8px; background: rgba(29, 34, 48, .45); }
.tag small { font-size: 10px; color: var(--soft); }
.tag:hover, .tag.on { background: rgba(255, 255, 255, .9); }
.tag.on { box-shadow: 0 0 0 1.5px var(--sapphire), 0 8px 24px rgba(30, 36, 50, .16); }
.tag.hide { opacity: 0; pointer-events: none; }

/* The controls: one pane of frosted glass at the foot */
.panel { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 18px; align-items: center; padding: 8px 10px; border-radius: 16px; background: var(--glass); border: 1px solid rgba(255,255,255,.8); backdrop-filter: blur(14px) saturate(1.25); -webkit-backdrop-filter: blur(14px) saturate(1.25); box-shadow: 0 14px 40px rgba(30, 36, 50, .14); font-family: var(--mono); font-size: 11.5px; max-width: calc(100vw - 24px); box-sizing: border-box; }
.group { display: flex; align-items: center; gap: 4px; }
.group > span { color: var(--soft); margin: 0 6px 0 4px; letter-spacing: .04em; }
.group button { font: inherit; letter-spacing: .03em; color: var(--ink); background: transparent; border: 0; padding: 7px 11px; border-radius: 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; transition: background .25s, color .25s; }
.group button:hover { background: rgba(29, 34, 48, .06); }
.group button.on { background: var(--ink); color: #f4f1ec; }
.sw { width: 11px; height: 11px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); flex: none; }
.sep { width: 1px; align-self: stretch; background: rgba(29, 34, 48, .12); }

/* phones: one row, each setting a pill that steps through its options at a tap */
.cycle { display: none; }
@media (max-width: 760px) {
  .cap { left: 12px; top: 12px; font-size: 10.5px; max-width: 62%; }
  .hint { right: 10px; top: 10px; font-size: 10.5px; padding: 5px 10px; }
  .panel { left: 10px; right: 10px; transform: none; bottom: 10px; gap: 6px; padding: 6px; font-size: 10.5px; justify-content: space-between; }
  .group, .sep { display: none; }
  .cycle { display: flex; flex: 1; flex-direction: column; align-items: flex-start; gap: 1px; font: inherit; color: var(--ink); background: rgba(255,255,255,.55); border: 0; border-radius: 10px; padding: 6px 9px 7px; cursor: pointer; min-width: 0; }
  .cycle small { font-size: 9.5px; color: var(--soft); letter-spacing: .04em; }
  .cycle b { font-weight: 400; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .tag { font-size: 10px; padding: 4px 8px 5px; }
  .tag small { font-size: 9px; }
}
</style>
</head>
<body>

<div id="stage"></div>
<p class="cap" id="cap"><b>The Sapphire</b> · <span id="cap-text"></span></p>
<p class="hint" id="hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11m0-1.5a1.5 1.5 0 0 1 3 0V11m0-.5a1.5 1.5 0 0 1 3 0v4.5a6 6 0 0 1-6 6h-.6a6 6 0 0 1-4.6-2.2L4.3 15.6a1.5 1.5 0 0 1 2.2-2l2.5 2.4"/></svg><span id="hint-text"></span></p>
<div id="tags"></div>
<div class="panel" id="panel">
  <div class="group" data-k="light"><span id="l-light"></span></div>
  <div class="sep"></div>
  <div class="group" data-k="floor"><span id="l-floor"></span></div>
  <div class="sep"></div>
  <div class="group" data-k="kitchen"><span id="l-kitchen"></span></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ================= words ================= */
const LANG = (() => { try { const l = localStorage.getItem('fugahaus.lang'); if (l) return l; } catch (e) {} return (navigator.language || 'es').slice(0, 2); })();
const DICT = {
  es: { cap: 'Concepto · Planta 2C, la vivienda en 3D', drag: 'arrastra para girar', swipe: 'desliza para girar', light: 'luz', floor: 'suelo', kitchen: 'cocina',
        morning: 'mañana', sunset: 'atardecer', night: 'noche', stone: 'travertino', oak: 'roble', white: 'blanco', sapphire: 'zafiro',
        living: 'Salón comedor', kitchenR: 'Cocina', hall: 'Hall', terrace: 'Terraza' },
  en: { cap: 'Concept · Floor 2C, the home in 3D', drag: 'drag to rotate', swipe: 'swipe to rotate', light: 'light', floor: 'floor', kitchen: 'kitchen',
        morning: 'morning', sunset: 'sunset', night: 'night', stone: 'travertine', oak: 'oak', white: 'white', sapphire: 'sapphire',
        living: 'Living & dining', kitchenR: 'Kitchen', hall: 'Hall', terrace: 'Terrace' },
  fr: { cap: 'Concept · Étage 2C, le logement en 3D', drag: 'faites glisser pour tourner', swipe: 'glissez pour tourner', light: 'lumière', floor: 'sol', kitchen: 'cuisine',
        morning: 'matin', sunset: 'couchant', night: 'nuit', stone: 'travertin', oak: 'chêne', white: 'blanc', sapphire: 'saphir',
        living: 'Séjour', kitchenR: 'Cuisine', hall: 'Entrée', terrace: 'Terrasse' },
  de: { cap: 'Konzept · Etage 2C, die Wohnung in 3D', drag: 'ziehen zum Drehen', swipe: 'wischen zum Drehen', light: 'licht', floor: 'boden', kitchen: 'küche',
        morning: 'morgen', sunset: 'abend', night: 'nacht', stone: 'travertin', oak: 'eiche', white: 'weiß', sapphire: 'saphir',
        living: 'Wohnen & Essen', kitchenR: 'Küche', hall: 'Diele', terrace: 'Terrasse' },
};
const TX = DICT[LANG] || DICT.es;
const t = (k) => TX[k] ?? DICT.es[k] ?? k;
const touch = matchMedia('(pointer: coarse)').matches;
const phone = innerWidth < 760;
document.getElementById('cap-text').textContent = t('cap');
document.getElementById('hint-text').textContent = t(touch ? 'swipe' : 'drag');
['light', 'floor', 'kitchen'].forEach((k) => (document.getElementById('l-' + k).textContent = t(k)));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= renderer, scene ================= */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, phone ? 1.6 : 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const aniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 600);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.enablePan = false; controls.enableZoom = false;
controls.minPolarAngle = 0.45; controls.maxPolarAngle = 1.22;
controls.rotateSpeed = 0.6;
renderer.domElement.style.touchAction = 'pan-y';

/* ================= materials ================= */
const tex = (w, h, draw, repeat) => {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = aniso;
  if (repeat) t.repeat.set(repeat[0], repeat[1]);
  return t;
};
let seed = 11; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
// travertine: large pale slabs, faint veins, fine joints
const stoneTex = tex(1024, 1024, (x, w, h) => {
  x.fillStyle = '#e8ddcb'; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
    x.fillStyle = `hsl(36, 30%, ${86 + rnd() * 4}%)`; x.fillRect(i * w / 2 + 2, j * h / 2 + 2, w / 2 - 4, h / 2 - 4);
    for (let v = 0; v < 26; v++) { x.strokeStyle = `rgba(160,130,95,${.05 + rnd() * .07})`; x.lineWidth = 1 + rnd() * 2; x.beginPath(); const y0 = j * h / 2 + rnd() * h / 2; x.moveTo(i * w / 2, y0); x.bezierCurveTo(i * w / 2 + w / 6, y0 + rnd() * 30 - 15, i * w / 2 + w / 3, y0 + rnd() * 30 - 15, i * w / 2 + w / 2, y0 + rnd() * 20 - 10); x.stroke(); }
  }
  x.fillStyle = 'rgba(150,125,95,.35)'; x.fillRect(0, h / 2 - 2, w, 3); x.fillRect(w / 2 - 2, 0, 3, h);
}, [1, 1]);
// oak: long planks, a soft grain
const oakTex = tex(1024, 1024, (x, w, h) => {
  const n = 8; const pw = w / n;
  for (let i = 0; i < n; i++) {
    let y = -rnd() * 300;
    while (y < h) {
      const len = 260 + rnd() * 260;
      x.fillStyle = `hsl(${30 + rnd() * 5}, ${38 + rnd() * 8}%, ${58 + rnd() * 8}%)`; x.fillRect(i * pw, y, pw, len);
      for (let g = 0; g < 14; g++) { x.strokeStyle = `rgba(110,72,40,${.06 + rnd() * .08})`; x.lineWidth = 1; x.beginPath(); const gx = i * pw + rnd() * pw; x.moveTo(gx, y); x.bezierCurveTo(gx + rnd() * 6 - 3, y + len / 3, gx + rnd() * 6 - 3, y + len * .66, gx + rnd() * 4 - 2, y + len); x.stroke(); }
      x.fillStyle = 'rgba(90,60,35,.35)'; x.fillRect(i * pw, y, pw, 2);
      y += len;
    }
    x.fillStyle = 'rgba(90,60,35,.3)'; x.fillRect(i * pw, 0, 2, h);
  }
}, [1, 1]);
const linenTex = tex(256, 256, (x, w, h) => { x.fillStyle = '#ece6dc'; x.fillRect(0, 0, w, h); for (let i = 0; i < 3000; i++) { x.fillStyle = `rgba(120,100,80,${rnd() * .06})`; x.fillRect(rnd() * w, rnd() * h, 2, 1); } }, [3, 3]);

const M = {
  wall: new THREE.MeshStandardMaterial({ color: '#f1ece4', roughness: .92 }),
  wallTop: new THREE.MeshStandardMaterial({ color: '#cfc6b8', roughness: 1 }),
  stone: new THREE.MeshStandardMaterial({ map: stoneTex, roughness: .55 }),
  oak: new THREE.MeshStandardMaterial({ map: oakTex, roughness: .62 }),
  terrace: new THREE.MeshStandardMaterial({ map: stoneTex.clone(), roughness: .7, color: '#f3ede3' }),
  linen: new THREE.MeshStandardMaterial({ map: linenTex, color: '#f1ece3', roughness: .95 }),
  linenDark: new THREE.MeshStandardMaterial({ map: linenTex, color: '#d8cfc1', roughness: .95 }),
  wood: new THREE.MeshStandardMaterial({ map: oakTex, color: '#e7d2b6', roughness: .55 }),
  travertine: new THREE.MeshStandardMaterial({ map: stoneTex, color: '#f6efe2', roughness: .45 }),
  bronze: new THREE.MeshStandardMaterial({ color: '#6d5a46', roughness: .4, metalness: .6 }),
  frame: new THREE.MeshStandardMaterial({ color: '#8b7f70', roughness: .45, metalness: .5 }),
  glass: new THREE.MeshStandardMaterial({ color: '#cfe3ec', roughness: .05, metalness: 0, transparent: true, opacity: .16, depthWrite: false }),
  rail: new THREE.MeshStandardMaterial({ color: '#d9ecf2', roughness: .05, transparent: true, opacity: .28, depthWrite: false }),
  counter: new THREE.MeshStandardMaterial({ color: '#f5f2ec', roughness: .35 }),
  front: new THREE.MeshStandardMaterial({ color: '#f3efe8', roughness: .5 }),
  rug: new THREE.MeshStandardMaterial({ map: linenTex, color: '#e2d6c4', roughness: 1 }),
  leaf: new THREE.MeshStandardMaterial({ color: '#7f9a66', roughness: .8, side: THREE.DoubleSide }),
  trunk: new THREE.MeshStandardMaterial({ color: '#9b8466', roughness: .9 }),
  pot: new THREE.MeshStandardMaterial({ color: '#d7cbb8', roughness: .9 }),
  sapphire: new THREE.MeshStandardMaterial({ color: '#1f3fa6', roughness: .35, metalness: .1 }),
  lamp: new THREE.MeshStandardMaterial({ color: '#fff3dc', emissive: '#ffcf8a', emissiveIntensity: 0, roughness: .6 }),
  pool: new THREE.MeshStandardMaterial({ color: '#3f9bc4', roughness: .1 }),
};
M.terrace.map.repeat.set(1.6, 1.6);

/* ================= helpers ================= */
const house = new THREE.Group(); scene.add(house);
const add = (mesh, cast = true, receive = true, parent = house) => { mesh.castShadow = cast; mesh.receiveShadow = receive; parent.add(mesh); return mesh; };
const box = (w, h, d, mat, x, y, z, r = 0.02, ry = 0, parent) => {
  const g = r > 0 ? new RoundedBoxGeometry(w, h, d, 2, Math.min(r, w / 2, h / 2, d / 2)) : new THREE.BoxGeometry(w, h, d);
  const m = new THREE.Mesh(g, mat); m.position.set(x, y, z); m.rotation.y = ry; return add(m, true, true, parent);
};
// a floor: a polygon in plan (x, z), its texture laid in metres
const floor = (pts, mat, y = 0, tile = 1.2) => {
  const s = new THREE.Shape(pts.map(([x, z]) => new THREE.Vector2(x, -z)));
  const g = new THREE.ShapeGeometry(s); g.rotateX(-Math.PI / 2);
  const uv = g.attributes.uv, p = g.attributes.position;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, p.getX(i) / tile, p.getZ(i) / tile);
  const m = new THREE.Mesh(g, mat); m.position.y = y; return add(m, false, true);
};
// a slab under a floor, so the cut-away reads as a solid building
const slab = (pts, depth = 0.35, mat = M.wallTop) => {
  const s = new THREE.Shape(pts.map(([x, z]) => new THREE.Vector2(x, -z)));
  const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: false }); g.rotateX(-Math.PI / 2); g.translate(0, -depth - 0.002, 0);
  return add(new THREE.Mesh(g, [mat, M.wall]), false, true);
};
// walls cut at a little over a metre, as in a sectioned model, so the rooms read from outside
const WALL_H = 1.3;
// a wall from a to b, with its cut top a shade darker, as in a sectioned model
const wall = (a, b, th = 0.22, h = WALL_H) => {
  const dx = b[0] - a[0], dz = b[1] - a[1], len = Math.hypot(dx, dz);
  const g = new THREE.BoxGeometry(len + th, h, th);
  const m = new THREE.Mesh(g, [M.wall, M.wall, M.wallTop, M.wall, M.wall, M.wall]);
  m.position.set((a[0] + b[0]) / 2, h / 2, (a[1] + b[1]) / 2); m.rotation.y = -Math.atan2(dz, dx);
  return add(m);
};
// floor-to-ceiling glass in thin dark frames
const glazing = (a, b, panes = 3, h = WALL_H) => {
  const dx = b[0] - a[0], dz = b[1] - a[1], len = Math.hypot(dx, dz), ang = -Math.atan2(dz, dx);
  const g = new THREE.Group(); g.position.set((a[0] + b[0]) / 2, 0, (a[1] + b[1]) / 2); g.rotation.y = ang; house.add(g);
  const pane = new THREE.Mesh(new THREE.BoxGeometry(len, h - 0.06, 0.02), M.glass); pane.position.y = h / 2; g.add(pane);
  for (let i = 0; i <= panes; i++) { const f = new THREE.Mesh(new THREE.BoxGeometry(0.035, h, 0.05), M.frame); f.position.set(-len / 2 + (len * i) / panes, h / 2, 0); f.castShadow = true; g.add(f); }
  [0.02, h - 0.02].forEach((y) => { const f = new THREE.Mesh(new THREE.BoxGeometry(len, 0.035, 0.05), M.frame); f.position.y = y; g.add(f); });
  return g;
};
const rail = (a, b, h = 1.05) => {
  const dx = b[0] - a[0], dz = b[1] - a[1], len = Math.hypot(dx, dz);
  const m = new THREE.Mesh(new THREE.BoxGeometry(len, h, 0.025), M.rail); m.position.set((a[0] + b[0]) / 2, h / 2, (a[1] + b[1]) / 2); m.rotation.y = -Math.atan2(dz, dx); house.add(m);
  const top = new THREE.Mesh(new THREE.BoxGeometry(len, 0.03, 0.05), M.frame); top.position.set(m.position.x, h, m.position.z); top.rotation.y = m.rotation.y; house.add(top);
};
const column = (x, z) => { const c = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, WALL_H, 28), M.wall); c.position.set(x, WALL_H / 2, z); add(c); };

/* ================= the plan: day zone of Floor 2C, in metres ================= */
// Living & dining (68 m²), kitchen (13 m²) on the angled wall, hall, and the terrace that wraps it (84 m²)
const LIVING = [[0, 0], [7.1, 0], [7.1, 9.6], [0, 9.6]];
const KITCHEN = [[-3.4, 0], [-3.4, -1.4], [2.9, -4.1], [2.9, 0]];
const HALL = [[-5.2, 0], [0, 0], [0, 2.9], [-5.2, 2.9]];
const TERRACE = [[2.9, -4.1], [5.6, -4.9], [11.6, 9.0], [7.8, 11.0], [-0.2, 11.0], [-0.2, 9.6], [7.1, 9.6], [7.1, 0], [2.9, 0]];

const floors = {
  living: floor(LIVING, M.stone), kitchen: floor(KITCHEN, M.stone), hall: floor(HALL, M.stone),
};
floor(TERRACE, M.terrace, 0, 1.4);
slab([[-5.2, 2.9], [-5.2, 0], [-3.4, 0], [-3.4, -1.4], [2.9, -4.1], [5.6, -4.9], [11.6, 9.0], [7.8, 11.0], [-0.2, 11.0], [-0.2, 2.9]], 0.55);

// walls
wall([-3.4, 0], [-3.4, -1.4]); wall([-3.4, -1.4], [2.9, -4.1]); // kitchen: side, and the long angled wall
wall([-5.2, 0], [-3.4, 0]); wall([-5.2, 0], [-5.2, 2.9]); wall([-5.2, 2.9], [0, 2.9]); // hall
wall([0, 2.9], [0, 9.6]); // living, towards the bedrooms
wall([-0.2, 9.6], [0.4, 9.6]);
// glass: the kitchen to the upper terrace, the long front to the sea, the foot of the living room
glazing([2.9, -4.1], [2.9, 0], 2); glazing([2.9, 0], [7.1, 0], 2); glazing([7.1, 0], [7.1, 9.6], 4); glazing([0.4, 9.6], [7.1, 9.6], 3);
// the round columns of the plan
[[1.8, 0.8], [1.8, 4.3], [1.8, 8.3], [7.1, 0.8], [7.1, 4.3], [7.1, 8.3]].forEach(([x, z]) => column(x, z));
// terrace railings
rail([2.9, -4.1], [5.6, -4.9]); rail([5.6, -4.9], [11.6, 9.0]); rail([11.6, 9.0], [7.8, 11.0]); rail([7.8, 11.0], [-0.2, 11.0]);

/* ================= furniture ================= */
// dining: an oak table for six, linen chairs, three pendants
box(1.05, 0.05, 2.4, M.wood, 4.9, 0.74, 2.6, 0.02);
[[4.9, 1.65], [4.9, 3.55]].forEach(([x, z]) => box(0.12, 0.7, 0.12, M.wood, x, 0.36, z, 0.02));
const chair = (x, z, ry) => { const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = ry; house.add(g);

    if (!room.el) return;
    v3.set(...room.at).project(camera);
    const off = v3.z > 1 || Math.abs(v3.x) > 1.05 || Math.abs(v3.y) > 1.05 || it < 0.9;
    room.el.classList.toggle('hide', off);
    if (!off) room.el.style.transform = `translate(${((v3.x + 1) / 2) * w}px, ${((1 - v3.y) / 2) * h}px) translate(-50%, -100%)`;
  });

  renderer.render(scene, camera);
}

/* Run only while the page holding it says it is on screen; the flight in waits for that first sight */
let seen = false;
addEventListener('message', (e) => {
  if (e.data && typeof e.data.fhVisible === 'boolean') {
    if (e.data.fhVisible && !seen) { seen = true; introAt = null; }
    renderer.setAnimationLoop(e.data.fhVisible ? frame : null);
  }
});
applyHour(); setFloor('stone'); setKitchen('white');
stage.classList.add('on');
renderer.setAnimationLoop(frame);
</script>
</body>
