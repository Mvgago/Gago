<style>
/* A pale studio; Fuga Haus's quiet type over it */
:root {

<script type="importmap">
{ "imports": {

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { HorizontalBlurShader } from 'three/addons/shaders/HorizontalBlurShader.js';
import { VerticalBlurShader } from 'three/addons/shaders/VerticalBlurShader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { GroundedSkybox } from 'three/addons/objects/GroundedSkybox.js';

/* Buendía Travel's palette: its green, graphite, white. */
const C = { paper: '#f4f5f3', card: '#ffffff', line: 'rgba(35,39,42,0.12)', text: '#23272a', muted: '#6b7276', green: '#66b944', greenDeep: '#4f9a31', red: '#e0524f' };
const POP = 'Poppins, sans-serif';
const DISPLAY = 'Jura, sans-serif';
const MONO = '"JetBrains Mono", ui-monospace, Menlo, monospace';
const TAU = Math.PI * 2;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* The destinations, from Buendía's own pieces */
const loadImg = (src) => new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = fail; i.src = src; });
const IMG = Object.fromEntries(await Promise.all(['londres', 'lisboa', 'bruselas', 'granada', 'leones', 'costa'].map(async n => [n, await loadImg('../buendia-words/' + n + '.jpg')])));
try {
  await Promise.race([
    Promise.all([`300 40px ${POP}`, `400 40px ${POP}`, `600 40px ${POP}`, `700 40px ${POP}`, `800 40px ${POP}`, `400 20px ${MONO}`].map(f => document.fonts.load(f))),
    new Promise(r => setTimeout(r, 2000)),
  ]);
} catch (e) {}

/* ================= helpers ================= */
const clamp01 = x => Math.min(1, Math.max(0, x));
const seg = (t, a, b) => clamp01((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - clamp01(x), 3);
const eInOut = x => { x = clamp01(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }
function mono(ctx, txt, x, y, col = C.muted, size = 15, align = 'left', weight = 400) {
  ctx.fillStyle = col; ctx.font = `${weight} ${size}px ${MONO}`; ctx.textAlign = align; ctx.fillText(txt, x, y); ctx.textAlign = 'left';
}
// Large photos come from mockups: a whisper of blur and film grain hides their pixels
const grainTile = (() => { const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d'); const d = x.createImageData(128, 128); for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 22; } x.putImageData(d, 0, 0); return c; })();
function coverSoft(ctx, img, x, y, w, h, zoom = 1) {
  ctx.save(); ctx.filter = 'blur(1.2px) saturate(1.08)'; cover(ctx, img, x, y, w, h, zoom); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip(); ctx.fillStyle = ctx.createPattern(grainTile, 'repeat'); ctx.fillRect(x, y, w, h); ctx.restore();
}
function cover(ctx, img, x, y, w, h, zoom = 1) {
  const s = Math.max(w / img.width, h / img.height) * zoom, iw = img.width * s, ih = img.height * s;
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.drawImage(img, x + (w - iw) / 2, y + (h - ih) / 2, iw, ih); ctx.restore();
}
function pop(ctx, txt, x, y, size, weight = 400, col = C.text, align = 'left') {
  ctx.fillStyle = col; ctx.font = `${weight} ${size}px ${POP}`; ctx.textAlign = align; ctx.fillText(txt, x, y); ctx.textAlign = 'left';
}
// Buendía's wordmark as on its website: "Buendía" bold, "Travel" light in green
function wordmark(ctx, x, y, size, dark = true) {
  ctx.font = `700 ${size}px ${POP}`; ctx.fillStyle = dark ? C.text : '#ffffff'; ctx.textAlign = 'left'; ctx.fillText('Buendía', x, y);
  const w = ctx.measureText('Buendía').width;
  ctx.font = `300 ${size}px ${POP}`; ctx.fillStyle = dark ? C.green : '#ffffff'; ctx.fillText('Travel', x + w + size * .2, y);
}
const paperCache = {};
function paper(ctx, w, h) {
  const key = w + 'x' + h;
  if (!paperCache[key]) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    paperRaw(c.getContext('2d'), w, h);
    paperCache[key] = c;
  }
  ctx.drawImage(paperCache[key], 0, 0);
}
function paperRaw(ctx, w, h) {
  ctx.fillStyle = C.paper; ctx.fillRect(0, 0, w, h);
  // A very fine technical grid
  ctx.strokeStyle = 'rgba(35,39,42,0.0)'; ctx.lineWidth = 1;
  for (let x = 0; x < w; x += 32) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
  for (let y = 0; y < h; y += 32) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
}
function check(ctx, x, y, s, col) {
  ctx.strokeStyle = col; ctx.lineWidth = s * .16; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x - s * .32, y + s * .02); ctx.lineTo(x - s * .08, y + s * .28); ctx.lineTo(x + s * .36, y - s * .24); ctx.stroke();
}
function shield(ctx, cx, cy, s, stroke, fill) {
  ctx.save(); ctx.translate(cx, cy); ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(0, -s); ctx.bezierCurveTo(s * .5, -s * .76, s * .82, -s * .82, s * .82, -s * .82);
  ctx.lineTo(s * .82, -s * .05); ctx.bezierCurveTo(s * .82, s * .55, s * .35, s * .88, 0, s);
  ctx.bezierCurveTo(-s * .35, s * .88, -s * .82, s * .55, -s * .82, -s * .05);
  ctx.lineTo(-s * .82, -s * .82); ctx.bezierCurveTo(-s * .82, -s * .82, -s * .5, -s * .76, 0, -s);
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = stroke; ctx.lineWidth = s * .07; ctx.stroke();
  ctx.restore();
}

/* ================= tablet: the Buendía website, a search for Europe and a booking ================= */
const TW = 1280, TH = 904, PW = 600, PH = 1280;
const CARDS = [
  { img: 'londres', city: 'Londres', what: 'Paseo por el Támesis', price: 29 },
  { img: 'lisboa', city: 'Lisboa', what: 'Barrios del tranvía 28', price: 24 },
  { img: 'granada', city: 'Granada', what: 'La Alhambra al completo', price: 35 },
  { img: 'bruselas', city: 'Bruselas', what: 'La Grand-Place y su historia', price: 19 },
];
function tabletUI(ctx, t) {
  const cyc = t % 13;
  ctx.fillStyle = C.paper; ctx.fillRect(0, 0, TW, TH);
  // Header, in the brand's green, the wordmark and the menu in white
  ctx.fillStyle = C.green; ctx.fillRect(0, 0, TW, 92);
  wordmark(ctx, 56, 60, 34, false);
  { ctx.font = `400 20px ${POP}`; let nx = TW - 56 - ctx.measureText('ES').width - 48;
    ['Ofertas', 'Experiencias', 'Destinos'].forEach(n => { pop(ctx, n, nx, 58, 20, 400, 'rgba(255,255,255,0.88)', 'right'); nx -= ctx.measureText(n).width + 40; }); }
  pop(ctx, 'ES', TW - 56, 58, 20, 600, '#ffffff', 'right');
  // Promo bar
  ctx.fillStyle = '#23272a'; ctx.fillRect(0, 92, TW, 50);
  ctx.fillStyle = C.green; ctx.beginPath(); ctx.arc(70, 117, 7, 0, TAU); ctx.fill();
  pop(ctx, 'Verano en Europa · hasta ', 92, 125, 20, 400, '#ffffff');
  ctx.font = `400 20px ${POP}`; const pw = ctx.measureText('Verano en Europa · hasta ').width;
  pop(ctx, '-30 %', 92 + pw, 125, 20, 700, C.green);

  // Hero: the destinations cross-fade slowly behind the line
  const HY = 142, HH = 330;
  // One destination behind the search, still: London on the Thames
  coverSoft(ctx, IMG.londres, 0, HY, TW, HH, 1.04);
  const sh = ctx.createLinearGradient(0, HY, 0, HY + HH); sh.addColorStop(0, 'rgba(20,24,28,0.15)'); sh.addColorStop(1, 'rgba(20,24,28,0.55)');
  ctx.fillStyle = sh; ctx.fillRect(0, HY, TW, HH);
  pop(ctx, 'Reserva actividades y', TW / 2, HY + 112, 52, 700, '#ffffff', 'center');
  pop(ctx, 'excursiones únicas', TW / 2, HY + 174, 52, 700, '#ffffff', 'center');
  // Search: the question, then "Europa" typed in
  // One piece: a white field and the green button joined, a single rounded shape, centred
  const BTN = 180, SW = 600, SX = (TW - SW - BTN) / 2, SY = HY + 214, SHh = 68;
  ctx.save(); rr(ctx, SX, SY, SW + BTN, SHh, 12); ctx.clip();
  ctx.fillStyle = '#ffffff'; ctx.fillRect(SX, SY, SW, SHh);
  ctx.restore();
  const query = 'Europa';
  const n = Math.floor(seg(cyc, 1.0, 2.4) * query.length);
  if (n === 0) pop(ctx, '¿Dónde quieres pasar un Buendía?', SX + 28, SY + 44, 21, 400, '#9aa0a4');
  else {
    pop(ctx, query.slice(0, n), SX + 28, SY + 45, 24, 600, C.text);
    if (cyc < 3.2 && Math.floor(t * 2) % 2) { ctx.font = `600 24px ${POP}`; ctx.fillStyle = C.text; ctx.fillRect(SX + 30 + ctx.measureText(query.slice(0, n)).width, SY + 22, 2, 30); }
  }
  const press = cyc > 2.8 && cyc < 3.1 ? .96 : 1;
  // the button: square where it meets the field, rounded on the outside
  ctx.save(); rr(ctx, SX, SY, SW + BTN, SHh, 12); ctx.clip();
  ctx.fillStyle = press < 1 ? C.greenDeep : C.green; ctx.fillRect(SX + SW, SY, BTN, SHh);
  ctx.restore();
  pop(ctx, 'Buscar', SX + SW + BTN / 2, SY + SHh / 2 + 8, 24, 600, '#ffffff', 'center');

  // Results: Europe's experiences, appearing one after another
  const RY = 478;
  // Before the search: the popular destinations, as on the real site; after it, the results for Europe.
  // The page is never empty.
  const results = cyc >= 3.4;
  const show = results ? seg(cyc, 3.4, 3.8) : 1 - seg(cyc, 3.2, 3.4);
  ctx.globalAlpha = show;
  pop(ctx, results ? 'Experiencias en Europa' : 'Destinos más populares', 56, RY + 30, 30, 700, C.text);
  pop(ctx, results ? '4 destinos · reserva al instante' : 'elegidos por nuestros viajeros', TW - 56, RY + 28, 18, 400, C.muted, 'right');
  ctx.globalAlpha = 1;
  const CW = (TW - 112 - 3 * 24) / 4, CH = 296, CY0 = RY + 52;
  const picked = 1; // Lisboa
  const lift = eOut(seg(cyc, 6.6, 7.1)) * (1 - seg(cyc, 11.5, 12));
  CARDS.forEach((c, i) => {
    const a = results ? eOut(seg(cyc, 3.5 + i * .2, 4.2 + i * .2)) : 1 - seg(cyc, 3.2, 3.4);
    if (a <= 0) return;
    const x = 56 + i * (CW + 24), y = CY0 + (1 - a) * 30 - (i === picked ? lift * 12 : 0);
    ctx.globalAlpha = a;
    ctx.fillStyle = i === picked && lift > 0 ? `rgba(0,0,0,${.08 * lift})` : 'rgba(0,0,0,0)';
    rr(ctx, x + 4, y + 14, CW, CH, 16); ctx.fill();
    ctx.fillStyle = '#ffffff'; rr(ctx, x, y, CW, CH, 16); ctx.fill();
    ctx.save(); rr(ctx, x, y, CW, 170, 16); ctx.clip(); cover(ctx, IMG[c.img], x, y, CW, 186); ctx.restore();
    if (results) {
    ctx.font = `700 18px ${POP}`; const bw = ctx.measureText('-30 %').width + 32;
    ctx.fillStyle = C.green; rr(ctx, x + 16, y + 16, bw, 38, 19); ctx.fill();
    pop(ctx, '-30 %', x + 16 + bw / 2, y + 41, 18, 700, '#ffffff', 'center');
    }
    pop(ctx, c.city, x + 22, y + 210, 24, 700, C.text);
    pop(ctx, c.what, x + 22, y + 240, 17, 400, C.muted);
    pop(ctx, 'desde', x + 22, y + 276, 17, 400, C.muted);
    ctx.font = `400 17px ${POP}`; const dw = ctx.measureText('desde ').width;
    pop(ctx, c.price + ' €', x + 22 + dw, y + 276, 24, 700, C.greenDeep);
    if (i === picked && lift > 0) { ctx.strokeStyle = `rgba(102,185,68,${lift})`; ctx.lineWidth = 3; rr(ctx, x, y, CW, CH, 16); ctx.stroke(); }
    ctx.globalAlpha = 1;
  });
  // A pointer goes to Lisboa and books it
  const px0 = SX + SW + 90, py0 = SY + SHh / 2, px1 = 56 + picked * (CW + 24) + CW * .62, py1 = CY0 + 120;
  const m = eInOut(seg(cyc, 5.2, 6.6));
  if (cyc > 2.2 && cyc < 11.6) {
    const pxx = cyc < 5.2 ? px0 : px0 + (px1 - px0) * m, pyy = cyc < 5.2 ? py0 : py0 + (py1 - py0) * m;
    ctx.save(); ctx.translate(pxx, pyy);
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = C.text; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 34); ctx.lineTo(9, 26); ctx.lineTo(16, 40); ctx.lineTo(22, 37); ctx.lineTo(15, 23); ctx.lineTo(27, 23); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  // Booking confirmed
  const ok = eOut(seg(cyc, 7.6, 8.2)) * (1 - seg(cyc, 11.4, 12));
  if (ok > 0) {
    ctx.globalAlpha = ok;
    const msg = 'Reserva confirmada · Lisboa · 2 personas';
    ctx.font = `600 19px ${POP}`; const tw = ctx.measureText(msg).width + 24 + 32 + 16 + 28;
    const bx = TW / 2 - tw / 2, by = TH - 70 - (1 - ok) * 20;
    ctx.fillStyle = '#23272a'; rr(ctx, bx, by, tw, 60, 30); ctx.fill();
    ctx.fillStyle = C.green; ctx.beginPath(); ctx.arc(bx + 24 + 16, by + 30, 16, 0, TAU); ctx.fill();
    check(ctx, bx + 24 + 16, by + 29, 22, '#ffffff');
    pop(ctx, msg, bx + 24 + 32 + 16, by + 37, 19, 600, '#ffffff');
    ctx.globalAlpha = 1;
  }
  // A short fade through white where the loop starts again (end of the cycle → start of the next)
  const wipe = Math.max(seg(cyc, 12.5, 12.95), 1 - seg(cyc, 0, .45));
  if (wipe > 0) { ctx.fillStyle = `rgba(255,255,255,${eInOut(wipe) * .92})`; ctx.fillRect(0, 0, TW, TH); }
}

/* ================= phone: the summer campaign, as stories ================= */
// A line of type arriving: rises and fades in from its own moment in the story (f: 0 → 1)
function arrive(f, at) { const p = eOut(seg(f, at, at + .1)); return { a: p, dy: (1 - p) * 26 }; }
// No shadow on the type: the veil over the photograph carries the contrast
function shadowOn(ctx) { ctx.shadowBlur = 0; ctx.shadowOffsetY = 0; }
function shadowOff(ctx) { ctx.shadowBlur = 0; ctx.shadowOffsetY = 0; }
// Text sized to fill a width, as a poster headline
function fitPop(ctx, txt, x, y, maxW, maxSize, weight, col, align = 'center') {
  ctx.font = `${weight} ${maxSize}px ${POP}`; const w = ctx.measureText(txt).width;
  const size = Math.min(maxSize, maxSize * maxW / w);
  pop(ctx, txt, x, y, size, weight, col, align); return size;
}
// A green tag, slightly turned, as on Buendía's posts
function tag(ctx, txt, cx, cy, size, rot, a) {
  ctx.save(); ctx.globalAlpha = a; ctx.translate(cx, cy); ctx.rotate(rot);
  ctx.font = `800 ${size}px ${POP}`; const w = ctx.measureText(txt).width;
  ctx.fillStyle = C.green; rr(ctx, -w / 2 - size * .5, -size * .98, w + size * 1, size * 1.4, size * .2); ctx.fill();
  pop(ctx, txt, 0, 0, size, 800, '#ffffff', 'center'); ctx.restore();
}
/* Every story on one layout: a small label, a light line, a bold line, a green tag.
   Same sizes, same weights, same places, never closer than M to the screen's edges. */
const M = 64, TXT_W = PW - M * 2;
const STORY_T = { label: 24, line: 60, tag: 56 };
function story(ctx, f, { label, light, bold, tagTxt }) {
  let r = arrive(f, .04); ctx.globalAlpha = r.a;
  ctx.font = `600 ${STORY_T.label}px ${POP}`;
  // a little tracking on the label
  const chars = [...label], gap = 3, lw = chars.reduce((w, ch) => w + ctx.measureText(ch).width + gap, -gap);
  let x = PW / 2 - lw / 2; ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.textAlign = 'left';
  chars.forEach(ch => { ctx.fillText(ch, x, 520 + r.dy); x += ctx.measureText(ch).width + gap; });
  r = arrive(f, .1); ctx.globalAlpha = r.a; fitPop(ctx, light, PW / 2, 600 + r.dy, TXT_W, STORY_T.line, 300, '#ffffff');
  r = arrive(f, .16); ctx.globalAlpha = r.a; fitPop(ctx, bold, PW / 2, 672 + r.dy, TXT_W, STORY_T.line, 700, '#ffffff');
  ctx.globalAlpha = 1;
  r = arrive(f, .26); tag(ctx, tagTxt, PW / 2, 800 + r.dy, STORY_T.tag, -.05, r.a);
}
const STORIES = [
  { img: 'lisboa', draw: (ctx, f) => story(ctx, f, { label: 'ESTE VERANO', light: 'te ligas al', bold: 'vecino guapo.', tagTxt: 'PORTUGAL' }) },
  { img: 'bruselas', draw: (ctx, f) => story(ctx, f, { label: 'VERANO EN EUROPA', light: 'viaja con', bold: 'hasta un -30 %', tagTxt: 'RESERVA YA' }) },
  { img: 'leones', draw: (ctx, f) => story(ctx, f, { label: 'GRANADA', light: 'los 12 guardianes', bold: 'te esperan.', tagTxt: 'ALHAMBRA' }) },
];

/* The lion's water: a thin falling jet of light drops, with a soft sheen, from its mouth.
   The mouth's place is computed from how the photograph is fitted to the screen. */
function fountain(ctx, t) {
  const img = IMG.leones, s = Math.max(PW / img.width, PH / img.height) * (1.06 + ((t % 4.2) / 4.2) * .08);
  const ox = (PW - img.width * s) / 2, oy = (PH - img.height * s) / 2;
  const mx = ox + 583 * s, my = oy + 214 * s, fall = PH - my;
  ctx.save();
  // the continuous sheen of the jet
  const g = ctx.createLinearGradient(0, my, 0, my + fall);
  g.addColorStop(0, 'rgba(235,245,255,0.95)'); g.addColorStop(1, 'rgba(235,245,255,0.3)');
  ctx.shadowColor = 'rgba(255,255,255,0.8)'; ctx.shadowBlur = 10;
  ctx.strokeStyle = g; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(mx, my);
  for (let y = 0; y <= fall; y += 20) ctx.lineTo(mx + Math.sin(y * .05 + t * 9) * 1.2 + y * .012, my + y);
  ctx.stroke();
  ctx.shadowBlur = 0;
  // drops running down it
  for (let i = 0; i < 26; i++) {
    const p = ((t * 1.6 + i / 26) % 1), y = my + p * p * fall;
    ctx.fillStyle = `rgba(255,255,255,${.85 * (1 - p * .7)})`;
    ctx.beginPath(); ctx.ellipse(mx + p * fall * .012 + Math.sin(i * 7) * 1.5, y, 2.4, 6 + p * 8, 0, 0, TAU); ctx.fill();
  }
  // a little splash where it lands
  for (let i = 0; i < 6; i++) {
    const p = ((t * 2 + i / 6) % 1), a = i / 6 * Math.PI;
    ctx.fillStyle = `rgba(255,255,255,${.6 * (1 - p)})`;
    ctx.beginPath(); ctx.arc(mx + fall * .012 + Math.cos(a) * p * 26, PH - 6 - Math.sin(a) * p * 18, 2.5, 0, TAU); ctx.fill();
  }
  ctx.restore();
}
function phoneUI(ctx, t) {
  const D = 4.2, k = Math.floor(t / D) % STORIES.length, f = (t % D) / D, st = STORIES[k];

  mesh.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(seg), new THREE.LineBasicMaterial({ color: '#ffffff', transparent: true, opacity: .32, depthWrite: false, toneMapped: false })));
  const dot = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d'); const g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.35, 'rgba(255,255,255,0.7)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();
  mesh.add(new THREE.Points(new THREE.BufferGeometry().setFromPoints(pts), new THREE.PointsMaterial({ size: .14, map: dot, transparent: true, depthWrite: false, toneMapped: false })));
}
// (the mesh is kept out of the scene)
const scan = new THREE.Group(); // (kept empty: no scan line)
const panels = [];

/* Devices: brushed aluminium, black glass front, a screen that emits its own light */
const shellMat = new THREE.MeshPhysicalMaterial({ fog: false, transparent: true, color: '#b9bfc4', metalness: 1, roughness: .32, clearcoat: .25, clearcoatRoughness: .3 });
const bezelMat = new THREE.MeshPhysicalMaterial({ fog: false, transparent: true, color: '#08090a', metalness: .1, roughness: .1, clearcoat: 1 });
const glassMat = new THREE.MeshPhysicalMaterial({ color: '#ffffff', metalness: 0, roughness: .03, clearcoat: 1, clearcoatRoughness: .02, transparent: true, opacity: .04, depthWrite: false });
const btnMat = new THREE.MeshStandardMaterial({ transparent: true, color: '#aab0b5', metalness: 1, roughness: .3 });
function device(w, h, d, r, sw, sh, texW, texH) {
  const g = new THREE.Group();
  // The body as a rounded rectangle in plan (a rounded box would cap its radius at half the
  // thickness), extruded with a soft bevel on its edges, as a real device is machined
  const plan = (pw, ph, pr) => {
    const s = new THREE.Shape(), x0 = -pw / 2, y0 = -ph / 2;
    s.moveTo(x0 + pr, y0); s.lineTo(x0 + pw - pr, y0); s.quadraticCurveTo(x0 + pw, y0, x0 + pw, y0 + pr);
    s.lineTo(x0 + pw, y0 + ph - pr); s.quadraticCurveTo(x0 + pw, y0 + ph, x0 + pw - pr, y0 + ph);
    s.lineTo(x0 + pr, y0 + ph); s.quadraticCurveTo(x0, y0 + ph, x0, y0 + ph - pr);
    s.lineTo(x0, y0 + pr); s.quadraticCurveTo(x0, y0, x0 + pr, y0);
    return s;
  };
  const bev = d * .3;
  const bodyGeo = new THREE.ExtrudeGeometry(plan(w - bev * 2, h - bev * 2, r - bev), { depth: d - bev * 2, bevelEnabled: true, bevelThickness: bev, bevelSize: bev, bevelSegments: 6, curveSegments: 24 });
  bodyGeo.translate(0, 0, -(d - bev * 2) / 2);
  g.add(new THREE.Mesh(bodyGeo, shellMat));
  const front = new THREE.Mesh(new THREE.ShapeGeometry(plan(w - .02, h - .02, r * .92), 24), bezelMat); front.position.z = d / 2 + .001; g.add(front);
  const c = document.createElement('canvas'); c.width = texW; c.height = texH;
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = maxAniso;
  const scr = new THREE.Mesh(new THREE.PlaneGeometry(sw, sh), new THREE.MeshBasicMaterial({ map: tex, toneMapped: false, transparent: true, fog: false }));
  scr.position.z = d / 2 + .0032; g.add(scr);
  const glass = new THREE.Mesh(new THREE.ShapeGeometry(plan(w - .03, h - .03, r * .9), 24), glassMat); glass.position.z = d / 2 + .0045; g.add(glass);
  const btn = new THREE.Mesh(new RoundedBoxGeometry(.014, h * .09, d * .38, 2, .006), btnMat); btn.position.set(w / 2 + .004, h * .24, 0); g.add(btn);
  g.traverse(o => { if (o.isMesh) o.renderOrder = 10; });
  scene.add(g);
  return { group: g, screen: scr, ctx: c.getContext('2d'), tex };
}
const tablet = device(2.3, 1.66, .06, .16, 2.17, 1.532, TW, TH);
const phone = device(.78, 1.6, .075, .16, .716, 1.528, PW, PH);
// Slightly crossed, with air between them
const TPOS = new THREE.Vector3(-.6, 3.65, -.25), PPOS = new THREE.Vector3(1.65, 3.5, .7);
tablet.group.position.copy(TPOS); tablet.group.rotation.set(-.12, .5, .03);
phone.group.position.copy(PPOS); phone.group.rotation.set(-.06, -.32, -.09);

/* Light */
scene.add(new THREE.HemisphereLight('#ffffff', '#9a958c', .25));
const key = new THREE.DirectionalLight('#fff3e0', .9); key.position.set(-6, 9, 4); scene.add(key);
const rim = new THREE.DirectionalLight('#fff0d8', .6); rim.position.set(-4, 3, -4); scene.add(rim);

/* Soft contact shadows under the devices */
const SHW = 12, SHD = 10, SHH = 5;
const shadowGroup = new THREE.Group(); shadowGroup.position.set(-.3, .002, -.6); scene.add(shadowGroup);
const rt = new THREE.WebGLRenderTarget(1024, 1024); rt.texture.generateMipmaps = false;
const rtBlur = new THREE.WebGLRenderTarget(1024, 1024); rtBlur.texture.generateMipmaps = false;
const shPlaneGeo = new THREE.PlaneGeometry(SHW, SHD).rotateX(Math.PI / 2);
const shPlane = new THREE.Mesh(shPlaneGeo, new THREE.MeshBasicMaterial({ map: rt.texture, opacity: .55, transparent: true, depthWrite: false, toneMapped: false }));
shPlane.renderOrder = 1; shPlane.scale.y = -1; shPlane.visible = false;
const blurPlane = new THREE.Mesh(shPlaneGeo); blurPlane.visible = false; shadowGroup.add(blurPlane);
const shCam = new THREE.OrthographicCamera(-SHW / 2, SHW / 2, SHD / 2, -SHD / 2, 0, SHH); shCam.rotation.x = Math.PI / 2; shadowGroup.add(shCam);
const depthMat = new THREE.MeshDepthMaterial(); depthMat.userData.darkness = { value: 1.3 };
depthMat.onBeforeCompile = sh => {
  sh.uniforms.darkness = depthMat.userData.darkness;
  sh.fragmentShader = 'uniform float darkness;\n' + sh.fragmentShader.replace('gl_FragColor = vec4( vec3( 1.0 - fragCoordZ ), opacity );', 'gl_FragColor = vec4( vec3( 0.0 ), ( 1.0 - fragCoordZ ) * darkness );');
};
depthMat.depthTest = false; depthMat.depthWrite = false;
const hBlur = new THREE.ShaderMaterial(HorizontalBlurShader); hBlur.depthTest = false;
const vBlur = new THREE.ShaderMaterial(VerticalBlurShader); vBlur.depthTest = false;
function blurShadow(amount) {
  blurPlane.visible = true;
  blurPlane.material = hBlur; hBlur.uniforms.tDiffuse.value = rt.texture; hBlur.uniforms.h.value = amount / 256;
  renderer.setRenderTarget(rtBlur); renderer.render(blurPlane, shCam);
  blurPlane.material = vBlur; vBlur.uniforms.tDiffuse.value = rtBlur.texture; vBlur.uniforms.v.value = amount / 256;
  renderer.setRenderTarget(rt); renderer.render(blurPlane, shCam);
  blurPlane.visible = false;
}
function renderContactShadow() {
  [sky, shPlane, tech, halo].forEach(o => o.visible = false);
  [tablet, phone].forEach(d => d.group.children.forEach(m => { if (m.material === glassMat) m.visible = false; }));
  scene.overrideMaterial = depthMat;
  renderer.setClearColor(0x000000, 0);
  renderer.setRenderTarget(rt); renderer.clear(); renderer.render(scene, shCam);
  scene.overrideMaterial = null;
  blurShadow(3.2); blurShadow(1.4);
  renderer.setRenderTarget(null); renderer.setClearColor(0x000000, 1);
  [sky, tech, halo].forEach(o => o.visible = true);
  [tablet, phone].forEach(d => d.group.children.forEach(m => { if (m.material === glassMat) m.visible = true; }));
}

/* Post: a faint vignette and grain, multisampled for crisp edges */
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { samples: 4, type: THREE.HalfFloatType }));
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new OutputPass());
const finish = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, time: { value: 0 }, res: { value: new THREE.Vector2(1, 1) } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float time; uniform vec2 res; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
    void main(){
      vec4 c = texture2D(tDiffuse, vUv);
      vec2 q = vUv - .5; q.x *= res.x / res.y;
      c.rgb *= mix(.9, 1., smoothstep(1.05, .25, length(q)));
      c.rgb += (h(vUv * res + fract(time) * 100.) - .5) * .015;
      gl_FragColor = c;
    }`,
});
composer.addPass(finish);

/* ================= interaction: drag to turn ================= */
let idleUntil = 0;
controls.addEventListener('start', () => { idleUntil = Infinity; document.getElementById('hint').style.opacity = 0; });
controls.addEventListener('end', () => { idleUntil = clockNow() + 4; });
function fit() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h); composer.setSize(w, h);
  finish.uniforms.res.value.set(w, h);
  camera.aspect = w / h;
  camera.fov = w / h < .9 ? 48 : 30;
  camera.updateProjectionMatrix();
  const visH = 2 * CODE_DIST * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)), visW = visH * camera.aspect;
  const bandH = visH, bandW = bandH * (CODE_W / CODE_H);
  tech.scale.set(bandW, bandH, 1);
  tech.position.set(visW / 2 - bandW / 2 - visW * .02, 0, -CODE_DIST);
}
addEventListener('resize', fit); fit();

/* ================= loop ================= */
const clock = new THREE.Clock();
const clockNow = () => clock.getElapsedTime();
let prev = 0, introT = 0, frameN = 0, codeLast = 0;
const sph = new THREE.Spherical(), tmp = new THREE.Vector3();

function frame() {
  const T = clockNow(); prev = T;

  frameN++;
  if (frameN % 2 === 0) {
    tabletUI(tablet.ctx, T); roundScreen(tablet.ctx, TW, TH, 54); tablet.tex.needsUpdate = true;
    phoneUI(phone.ctx, T); island(phone.ctx); roundScreen(phone.ctx, PW, PH, 78); phone.tex.needsUpdate = true;
  }

  const it = eInOut((T - introT) / 3.2);
  if (it < 1) camera.position.lerpVectors(START, HOME, it);
  else if (T > idleUntil && !reduced) {
    tmp.copy(camera.position).sub(controls.target); sph.setFromVector3(tmp);
    sph.theta += (.02 + Math.sin(T * .12) * .1 - sph.theta) * .01;
    sph.phi += (1.72 + Math.sin(T * .09) * .02 - sph.phi) * .01;
    tmp.setFromSpherical(sph); camera.position.copy(controls.target).add(tmp);
  }
  if (it >= 1 && idleUntil === 0) idleUntil = T;

  if (!reduced) {
    mesh.rotation.y = Math.sin(T * .05) * .06; mesh.position.y = Math.sin(T * .12) * .08;
    tablet.group.position.y = TPOS.y + Math.sin(T * .45) * .035;
    phone.group.position.y = PPOS.y + Math.sin(T * .45 + 1.7) * .04;
  }

  controls.update();
  // no contact shadow: the devices are held at eye level, not standing on the square
  finish.uniforms.time.value = T;
  composer.render();
}

/* Run only while the page holding it says it is on screen */
addEventListener('message', (e) => {
  if (e.data && typeof e.data.fhVisible === 'boolean') renderer.setAnimationLoop(e.data.fhVisible ? frame : null);
});
introT = clockNow();
frameN = 1;
frame();
stage.classList.add('on');
renderer.setAnimationLoop(frame);
</script>
</body>
