<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <!-- The site translates itself (language switch): no browser translation bar -->
    <meta name="google" content="notranslate" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#a8a0a2" />
    <title>Fuga Haus — Designing atmospheres</title>
    <meta name="description" content="Fuga Haus is a design studio for brand identity, web and video." />

    <!-- Link preview (WhatsApp, LinkedIn, iMessage, email…). Crawlers need an absolute image URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fuga Haus" />
    <meta property="og:title" content="Fuga Haus — Designing atmospheres" />
    <meta property="og:description" content="Identity, web and video." />
    <meta property="og:url" content="https://fugahaus.com/" />
    <meta property="og:image" content="https://fugahaus.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Fuga Haus wordmark in polished metal, in a soft white studio." />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Tells search engines the site and the Instagram account are the same studio -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Fuga Haus",
        "url": "https://fugahaus.com/",
        "logo": "https://fugahaus.com/og.jpg",
        "email": "hola@fugahaus.com",
        "sameAs": ["https://www.instagram.com/fugahaus/"]
      }
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
