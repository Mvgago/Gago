<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <!-- The site translates itself (language switch): no browser translation bar -->
    <meta name="google" content="notranslate" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#a8a0a2" />
    <title>Fuga Haus — Hilando fino</title>
    <meta name="description" content="Independent design studio: strategy, identity, web and interactive 3D, and film." />

    <!-- Link preview (WhatsApp, LinkedIn, iMessage, email…). Crawlers need an absolute image URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fuga Haus" />
    <meta property="og:title" content="Fuga Haus — Hilando fino" />
    <meta property="og:description" content="Independent design studio: strategy, identity, web and interactive 3D, and film." />
    <meta property="og:url" content="https://fugahaus.com/" />
    <meta property="og:image" content="https://fugahaus.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Fuga Haus wordmark in polished metal, in a soft white studio." />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Tells search engines what the studio is, where it works, what it does, and that the site
         and the Instagram account are the same studio -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["Organization", "ProfessionalService"],
        "name": "Fuga Haus",
        "alternateName": "Fuga Haus Studio",
        "description": "Estudio de diseño independiente en Galicia: estrategia e identidad, web y 3D interactivo, espacios y eventos, y audiovisual.",
        "slogan": "Hilando fino",
        "url": "https://fugahaus.com/",
        "logo": "https://fugahaus.com/apple-touch-icon.png",
        "image": "https://fugahaus.com/og.jpg",
        "email": "hola@fugahaus.com",
        "address": { "@type": "PostalAddress", "addressRegion": "Galicia", "addressCountry": "ES" },
        "areaServed": [{ "@type": "AdministrativeArea", "name": "Galicia" }, { "@type": "Country", "name": "España" }],
        "knowsAbout": ["Identidad visual", "Estrategia de marca", "Diseño web", "3D interactivo", "Diseño de espacios y stands", "Audiovisual", "Diseño sonoro"],
        "sameAs": ["https://www.instagram.com/fugahaus/"]
      }
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Visits counted without cookies (Vercel Web Analytics; switch it on in the project's Analytics tab). Only on the live site -->
    <script>if (location.hostname.endsWith("fugahaus.com")) { const s = document.createElement("script"); s.defer = true; s.src = "/_vercel/insights/script.js"; document.head.appendChild(s); }</script>
  </body>
</html>
